name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: fmt
        run: test -z "$(gofmt -l ./cmd ./internal ./fsrs)"
      - name: test
        run: go test ./...
