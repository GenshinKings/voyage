<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前哨 2.0 · 全托管学习机</title>
<style>
:root{--ink:#1d1d1f;--paper:#f5f5f7;--side:rgba(255,255,255,.72);--line:rgba(0,0,0,.08);--mut:#86868b;--pink:#0071e3;--usr:#0071e3;--green:#34c759;--card:#fff;--chip:rgba(0,0,0,.045)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
#side{width:256px;background:var(--side);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid rgba(0,0,0,.06)}
#side .logo{padding:20px 18px 12px}
#side .logo .kicker{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:600;text-transform:uppercase}
#side .logo b{font-size:17px;letter-spacing:-.02em;display:block;margin-top:2px}
.sidebtns{padding:4px 10px 8px}
.sbtn{padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13.5px;margin-bottom:1px;transition:background 120ms ease-out,color 120ms ease-out,transform 100ms ease-out;user-select:none}
.sbtn:hover{background:var(--chip);color:var(--ink)}
.sbtn:active{transform:scale(.97)}
.sbtn.on{color:var(--pink);background:rgba(0,113,227,.1);font-weight:600}
#subjectBox{padding:6px 14px 14px;display:flex;gap:8px}
#subjectBox input{flex:1;min-width:0;border:1px solid rgba(0,0,0,.12);padding:7px 11px;font:inherit;font-size:13px;border-radius:9px;outline:none;background:#fff;transition:border-color 150ms,box-shadow 150ms}
#subjectBox input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#subjectBox button{border:none;background:var(--pink);color:#fff;padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;transition:transform 100ms ease-out,filter 150ms}
#subjectBox button:active{transform:scale(.96);filter:brightness(.92)}
#lessonList{flex:1;overflow-y:auto;padding:4px 10px}
.gc-form{display:flex;flex-direction:column;gap:8px}
.gc-form input{border:1px solid rgba(0,0,0,.12);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;outline:none;background:#fff}
.gc-form input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#agentsEdit{width:100%;min-height:260px;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:14px;font:12.5px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:none;background:#fff;resize:vertical}
#agentsEdit:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#subjFoot{padding:12px 18px;border-top:1px solid rgba(0,0,0,.06);font-size:12px;color:var(--mut);flex-shrink:0;line-height:1.6}
#subjFoot b{color:var(--ink);font-weight:600}
.grouplabel{font-size:11px;letter-spacing:.05em;color:var(--mut);margin:14px 8px 4px;font-weight:600}
.lp{padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:1px;display:flex;align-items:center;gap:8px;transition:background 120ms ease-out,transform 100ms ease-out;user-select:none}
.lp .lp-sub{font-size:11px;color:var(--mut);font-weight:400;margin-top:1px;letter-spacing:0}
.lp:hover{background:var(--chip)}
.lp:active{transform:scale(.98)}
.lp .st{font-size:11px;flex-shrink:0;width:14px;color:var(--mut)}
.lp.done .st{color:var(--green)}
.lp.today .st{color:var(--pink);font-weight:700}
.lp.on{background:rgba(0,113,227,.1);font-weight:600}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:rgba(245,245,247,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(0,0,0,.05)}
#topbar .kicker{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:600;text-transform:uppercase}
#topbar h1{font-size:20px;letter-spacing:-.02em;line-height:1.15;margin-top:1px}
.backbtn{border:1px solid rgba(0,113,227,.35);background:rgba(0,113,227,.08);color:var(--pink);padding:6px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:transform 100ms ease-out,background 150ms}
.backbtn:hover{background:rgba(0,113,227,.14)}
.backbtn:active{transform:scale(.96)}
#view{flex:1;overflow-y:auto;padding:84px 0 0}
#chat{max-width:736px;margin:0 auto;padding:0 28px 130px}
.msg{margin:14px 0;display:flex;animation:msgIn 260ms cubic-bezier(.2,.8,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#guideCard{max-width:880px;margin:6px auto 2px;padding:0 28px}
/* ===== 学习页 v3：状态卡 / 折叠条 / 航路 / 清单 ===== */
#guideCard .status{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:12px 18px;box-shadow:0 1px 2px rgba(16,27,41,.05),0 0 0 1px rgba(16,27,41,.04);font-size:14px}
#guideCard .status .seg{display:flex;align-items:baseline;gap:7px;color:var(--ink-soft)}
#guideCard .status .k{font-size:10.5px;letter-spacing:2px;color:var(--mut)}
#guideCard .status b{font-weight:700;color:var(--ink)}
#guideCard .status .big{font-size:24px;font-weight:800;color:var(--ink);line-height:1}
#guideCard .status .big i{font-style:normal;font-size:14px;color:var(--mut);font-weight:400}
#guideCard .status .accent{color:var(--pink)}
#guideCard .today{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
#guideCard .tcollapsed{display:flex;align-items:center;gap:6px;padding:12px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
#guideCard .chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px solid transparent;white-space:nowrap}
#guideCard .chip:hover{border-color:var(--line)}
#guideCard .chip .n{font-size:10.5px;font-weight:800;color:var(--mut)}
#guideCard .chip.current{border-color:var(--pink)}
#guideCard .chip.current .n{color:var(--pink)}
#guideCard .chip .cnt{font-size:11px;color:var(--pink);font-weight:700}
#guideCard .asep{color:#c9d0d9;font-size:12px}
#guideCard .tright{margin-left:auto;display:flex;align-items:center;gap:12px}
#guideCard .mroute{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
#guideCard .mroute .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
#guideCard .mroute .dot.done{background:var(--ink)}
#guideCard .mroute .bar{width:20px;height:1.5px;background:var(--line)}
#guideCard .mroute .ship{color:var(--pink);font-size:13px}
#guideCard .xbtn{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;background:var(--card);white-space:nowrap}
#guideCard .xbtn:hover{color:var(--ink);border-color:var(--ink)}
#guideCard .xexpanded{border-top:1px solid var(--line)}
#guideCard .xhint{display:flex;justify-content:flex-end;padding:8px 16px 0}
#guideCard .xhint span{font-size:11.5px;color:var(--mut);cursor:pointer}
#guideCard .xhint span:hover{color:var(--ink)}
#guideCard .voyage{position:relative;height:60px;margin:14px 16px 0}
#guideCard .voyage .sea{position:absolute;left:0;right:0;top:28px;border-top:1.5px dashed #c9d0d9}
#guideCard .voyage .port{position:absolute;top:18px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1.5px solid #b9c0ca}
#guideCard .voyage .port.done{background:var(--ink);border-color:var(--ink)}
#guideCard .voyage .port .lb{position:absolute;top:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:var(--mut)}
#guideCard .voyage .port:last-child .lb{left:auto;right:-10px;transform:none;text-align:right}
#guideCard .voyage .port .lb b{display:block;color:var(--ink);font-size:11px;text-align:center}
#guideCard .voyage .ship{position:absolute;top:20px;font-size:17px;transform:translateX(-50%)}
#guideCard .voyage .pct{position:absolute;top:-2px;transform:translateX(-50%);font-size:10.5px;color:var(--pink);font-weight:700}
#guideCard .tl{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-bottom:1px dashed var(--line)}
#guideCard .tl:last-of-type{border-bottom:none}
#guideCard .tl .no{font-size:28px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1px #b9c0ca;min-width:46px}
#guideCard .tl.primary .no{color:var(--pink);-webkit-text-stroke:0}
#guideCard .tl .cat{font-size:10px;letter-spacing:2px;color:var(--mut)}
#guideCard .tl .ti{font-size:15px;font-weight:600;margin-top:2px}
#guideCard .tl .why{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.6}
#guideCard .tl .act{flex-shrink:0;align-self:center;min-width:92px;text-align:right}
#guideCard .sline{display:flex;gap:20px;flex-wrap:wrap;padding:12px 16px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line)}
#guideCard .sline span b{color:var(--ink-soft)}
#guideCard .sline .warn b{color:var(--pink)}
/* 开场元条（对话流内） */
.meta-line{border-left:4px solid var(--ink);background:var(--card);border-radius:0 10px 10px 0;padding:11px 16px;margin:0 0 16px;display:flex;align-items:baseline;gap:13px;box-shadow:0 1px 2px rgba(16,27,41,.04)}
.meta-line .no{font-size:21px;font-weight:800;color:transparent;-webkit-text-stroke:1px #b9c0ca;line-height:1}
.meta-line .ti{font-size:14.5px;font-weight:600;color:var(--ink)}
.meta-line .ti .why{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:3px}
.meta-line .op{margin-left:auto;letter-spacing:2px;font-size:10.5px;color:#9aa2af;flex-shrink:0}
#planCard{max-width:736px;margin:8px auto 2px;padding:0 28px}
#planCard .pc{background:var(--card);border-radius:12px;padding:12px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);font-size:12.5px}
#planCard .pc-goals{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut)}
#planCard .pc-goals b{color:var(--ink);font-weight:600}
#planCard .pc-main{margin-top:8px;line-height:1.7}
#planCard .pc-item{display:flex;align-items:center;gap:8px;padding:3px 0}
#planCard .pc-item .backbtn{padding:2px 10px;font-size:11.5px}
#planCard .pc-mood{margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:8px;align-items:center;color:var(--mut)}
.rev-item{cursor:pointer}
.rev-item:hover{background:rgba(251,114,153,.06)}
#guideCard .gc{background:var(--card);border-radius:12px;padding:14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03)}
#guideCard .gc-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#guideCard .gc-prog{font-size:13px;font-weight:600;color:var(--ink)}
#guideCard .gc-prog b{font-size:15px}
#guideCard .gc-anchor{font-size:12px;color:var(--mut)}
#guideCard .gc-brief{font-size:13px;color:var(--mut);margin-top:5px;line-height:1.6}
#guideCard .gc-brief b{color:var(--ink)}
#guideCard .gc-next{font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06);line-height:1.6}
#guideCard .gc-next b{color:var(--pink);font-weight:600}
#guideCard .gc-profile{font-size:11.5px;color:var(--mut);margin-top:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guideCard .gc-profile:hover{color:var(--ink)}
#guideCard .gc-fetch{font-size:11.5px;color:var(--mut);margin-top:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guideCard .gc-fetch:hover{color:var(--ink)}
.rtag{display:inline-block;font-size:10px;color:var(--pink);border:1px solid rgba(251,114,153,.35);border-radius:6px;padding:0 5px;margin-right:5px;vertical-align:1.5px;font-weight:600}
.msg .bubble{max-width:78%;padding:11px 15px;border-radius:18px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.a .bubble{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);border-bottom-left-radius:6px}
.msg.u{justify-content:flex-end}
.msg.u .bubble{background:var(--usr);color:#fff;border-bottom-right-radius:6px}
.msg.u .bubble .mark{color:#fff}
.bubble .mark{display:block;margin-top:10px;font-weight:600;color:var(--green)}
.bubble .mark.partial{color:#c93400}
.bubble .mark.propose{color:var(--pink);font-size:12.5px;font-weight:600}
.msg.u .bubble .mark.partial{color:#ffd60a}
.inputbar{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:14px 28px 18px;background:rgba(245,245,247,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(0,0,0,.05)}
#chatbox{max-width:736px;margin:0 auto;display:flex;gap:10px}
#chatbox textarea{flex:1;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:11px 15px;font:inherit;font-size:14px;resize:none;height:48px;outline:none;background:#fff;transition:border-color 150ms,box-shadow 150ms}
#chatbox textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#chatbox button{align-self:flex-end;border:none;background:var(--pink);color:#fff;padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;transition:transform 100ms ease-out,filter 150ms}
#chatbox button:active{transform:scale(.95);filter:brightness(.92)}
.empty{color:var(--mut);text-align:center;margin-top:80px;font-size:14px;line-height:1.7}
#sediment{max-width:736px;margin:0 auto;padding:8px 28px 130px}
.counts{display:flex;gap:36px;margin:6px 0 14px}
.counts .c .n{font-size:34px;font-weight:700;letter-spacing:-.02em}
.counts .c .l{color:var(--mut);font-size:12.5px;font-weight:500}
.item{padding:11px 0 11px 16px;border-left:3px solid rgba(0,0,0,.1);margin:6px 0}
.item.d3{border-color:var(--ink)}.item.d2{border-color:var(--pink)}.item.d1{border-color:rgba(0,0,0,.18)}
.item.clickable{cursor:pointer;transition:background 120ms ease-out}
.item.clickable:hover{background:var(--chip)}
.item .t{font-weight:600;letter-spacing:-.01em}
.item .m{color:var(--mut);font-size:12.5px;margin-top:1px}
#graphWrap{height:calc(100vh - 240px);position:relative;margin:8px 24px 20px}
#readView{max-width:736px;margin:0 auto;padding:8px 28px 130px}
#dirView{max-width:880px;margin:0 auto;padding:8px 28px 130px}
.dir-msg{margin:14px 0;display:flex}
.dir-msg .bubble{max-width:78%;padding:11px 15px;border-radius:18px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.dir-msg.a .bubble{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);border-bottom-left-radius:6px}
.dir-msg.u{justify-content:flex-end}
.dir-msg.u .bubble{background:var(--usr);color:#fff;border-bottom-right-radius:6px}
.proposal-card{background:var(--card);border:1.5px solid var(--pink);border-radius:12px;padding:16px 18px;margin:14px 0}
.proposal-card h4{font-size:15px;margin:0 0 8px}
.proposal-card ol{margin:6px 0 12px 18px;font-size:13.5px;line-height:1.8}
.dir-input{display:flex;gap:10px;margin-top:12px}
.dir-input textarea{flex:1;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:11px 15px;font:inherit;font-size:14px;height:48px;resize:none;outline:none;background:#fff}
.dir-input textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
.dir-input button{border:none;background:var(--pink);color:#fff;padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;font-weight:600}
.brief-card{background:var(--card);border-left:3px solid var(--pink);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13.5px;line-height:1.8}
.reading-body{background:var(--card);border-radius:12px;padding:22px 26px;font-size:14.5px;line-height:1.85;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03)}
.reading-body h3{font-size:17px;letter-spacing:-.01em;margin:18px 0 6px}
.reading-body h4{font-size:14.5px;margin:14px 0 4px}
.reading-body pre{background:#f6f8fa;border:1px solid rgba(0,0,0,.07);border-radius:9px;padding:12px 14px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;overflow-x:auto;margin:10px 0;white-space:pre}
.reading-body code{background:#f0f1f3;border-radius:5px;padding:1px 6px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
.reading-body pre code{background:none;padding:0}
.reading-body blockquote{border-left:3px solid var(--pink);background:rgba(0,113,227,.05);border-radius:0 8px 8px 0;padding:8px 14px;margin:10px 0;color:#3a3a3c}
.reading-original{margin-bottom:10px}
canvas{width:100%;height:100%;display:block}
.gLegend{position:absolute;top:12px;left:14px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 12px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(28,28,30,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:9px 22px;font-size:13.5px;display:none;border-radius:999px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.18);letter-spacing:.01em}
a{color:var(--pink);text-decoration:none}
a:hover{text-decoration:underline}
.mut{color:var(--mut);font-size:13px}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:99px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(0,113,227,.22)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){#side,#topbar,.inputbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}}
/* ===== 左缘装置：竖排标注 + 航路进度药丸（大屏专属，填边缘不挤内容） ===== */
#edge{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:2;display:none;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
@media (min-width:1240px){#edge{display:flex}}
#edge .vtext{writing-mode:vertical-rl;letter-spacing:6px;font-size:10px;color:#b9c0ca;font-weight:600;user-select:none}
#edge .pill{width:4px;height:160px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
#edge .pill i{position:absolute;left:0;top:0;width:100%;height:12%;background:var(--pink);border-radius:4px}
#edge .pv{font-size:10px;color:var(--pink);font-weight:700}

/* ===== 设置页样式系统（修复裸控件） ===== */
#setView{max-width:1060px;margin:0 auto;padding:8px 28px 60px}
#setView .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
#setView .set-card{background:var(--card);border-radius:12px;padding:16px 20px;box-shadow:0 1px 2px rgba(16,27,41,.05),0 0 0 1px rgba(16,27,41,.03)}
#setView .set-card.wide{grid-column:1 / -1}
#setView .grouplabel{margin:0 0 10px}
#setView input,#setView textarea,#setView select{width:100%;border:1px solid rgba(0,0,0,.12);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;outline:none;background:#fff;transition:border-color 150ms,box-shadow 150ms;box-sizing:border-box}
#setView input:focus,#setView textarea:focus,#setView select:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(251,114,153,.14)}
#setView textarea{font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;resize:vertical;min-height:150px}
#setView .backbtn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:7px 16px;font-size:12.5px;cursor:pointer;transition:.15s}
#setView .backbtn:hover{background:var(--ink);color:#fff}
#setView .backbtn.hot{border-color:var(--pink);color:var(--pink)}
#setView .backbtn.hot:hover{background:var(--pink);color:#fff}
#setView .lp{background:var(--paper);border:1px solid var(--line);margin-bottom:6px}
#setView .lp.on{border-color:var(--pink)}
#setView .mut{font-size:11.5px}
#setView pre{white-space:pre-wrap;font-size:11.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;max-height:260px;overflow-y:auto}
</style>
</head>
<body>
<div id="edge"><span class="vtext">VOYAGE · 全托管学习机</span><div class="pill"><i id="edgePill"></i></div><span class="pv" id="edgePct">0%</span></div>
<div id="side">
  <div class="logo"><div class="kicker">OUTPOST 2.0</div><b>全托管学习机</b></div>
  <div class="sidebtns">
    <div class="sbtn on" data-v="learn">◈ 学习</div>
    <div class="sbtn" data-v="dir">◈ 方向</div>
    <div class="sbtn" data-v="read">◈ 阅读</div>
    <div class="sbtn" data-v="sediment">◈ 沉淀</div>
    <div class="sbtn" data-v="graph">◈ 关联</div>
    <div class="sbtn" data-v="set">◈ 设置</div>
  </div>
  <div id="subjectBox" style="cursor:pointer" onclick="switchTab('dir')" title="和 AI 助教聊聊你想学什么"><div class="mut" style="font-size:12.5px;padding:2px 0">＋ 想学新东西？去「方向」和助教聊</div></div>
  <div id="lessonList"><div class="empty" style="margin-top:24px;padding:0 10px">加载中…</div></div>
  <div id="subjFoot"></div>
</div>

<div id="main">
  <div id="topbar"><div><div class="kicker" id="kicker">LEARNING · 对话式教学</div><h1 id="lessonTitle">今天丢来的</h1></div><div style="display:flex;gap:8px;flex-shrink:0"><button id="todayClass" class="backbtn hidden" style="border-color:var(--line);color:var(--mut)" onclick="openTodayClass()">今天的课</button><button id="backToday" class="backbtn hidden" onclick="backToday()">← 跳回今日知识点</button></div></div>
  <div id="view">
    <div id="chatOuter"><div id="guideCard"></div><div id="planCard"></div><div id="chat"></div></div>
    <div id="dirView" class="hidden"></div>
    <div id="readView" class="hidden"></div>
    <div id="sediment" class="hidden"></div>
    <div id="setView" class="hidden"></div>
    <div id="graphWrap" class="hidden"><div class="gLegend">圆=收尾的知识点 · <span style="color:#0071e3;font-weight:600">━</span> 练习中真实调用的连接（×N=次数） · <span style="color:#b8c0c8">━</span> 课程先后 · 点圆回到对话</div><canvas id="graphCanvas"></canvas></div>
  </div>
  <div class="inputbar">
    <div id="chatbox">
      <textarea id="input" placeholder="回答检查题，或问点什么…（Enter 发送）"></textarea>
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const toast=(m,ms)=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||2400)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let STATE=null, CURRENT=null, LASTVERDICT=false;

async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(r.status>=400)throw new Error(j.error||j.Error||'请求失败');return j}
// 输入乱码防线（编码统一）：剪贴板编码不一致的文本带典型特征——提示但不拦发
function looksGarbled(t){
  if(!t)return false;
  if(t.indexOf('\uFFFD')>=0)return true;
  const dia=(t.match(/[♦◊◆]/g)||[]).length;
  const acc=(t.match(/[æøåÃâÅÞð]/g)||[]).length;
  return dia>=3&&acc>=1;
}
function garbleWarn(t){if(looksGarbled(t))toast('检测到疑似乱码输入（常见于剪贴板编码不一致）——已发送，但建议重新输入',4200)}

function fmtContent(raw){
  raw=raw||'';
  let hints='';
  // [PROPOSE-VOID]：旧提案作废（用户转向新方向）——收起提示
  if(raw.indexOf('[PROPOSE-VOID]')>=0){
    raw=raw.replace(/\[PROPOSE-VOID\]/g,'').trim();
    hints+='<span class="mark propose" style="color:var(--mut)">旧提案已收起——按新方向继续聊</span>';
  }
  // [PROPOSE] JSON 块折叠成一行提示（提案卡由方向视图单独渲染，消息流里不糊原始 JSON）
  let hint='';
  const i=raw.indexOf('[PROPOSE]');
  if(i>=0){
    let depth=0,end=-1,inStr=false;
    for(let j=i+9;j<raw.length;j++){
      const c=raw[j];
      if(inStr){if(c==='\\')j++;else if(c==='"')inStr=false;continue}
      if(c==='"')inStr=true;
      else if(c==='{')depth++;
      else if(c==='}'){depth--;if(depth===0){end=j+1;break}}
    }
    const before=raw.slice(0,i).replace(/\s+$/,'');
    const after=end>=0?raw.slice(end).replace(/^\s+/,''):'';
    raw=(before&&(before+'\n\n'))+after;
    hint='<span class="mark propose">📋 课程提案已生成'+(curView==='dir'?'——见下方卡片':'')+'</span>';
  }
  let html=esc(raw);
  html=html.replace(/\[PASS:partial\]/g,'<span class="mark partial">◐ 本节收尾（半懂也记录在案，继续往下走）</span>');
  html=html.replace(/\[PASS\]/g,'<span class="mark">✓ 本节收尾通过</span>');
  const body=hint+(html?'<br>'+html:'');
  return hints?hints+(body?'<br>'+body:''):body;
}
let curView='learn';
function updateChrome(v){
  // 「跳回今日知识点」只属于沉淀/关联两页；「今天的课」只在练习态（看完课的入口）
  const back=(v==='sediment'||v==='graph')&&STATE&&STATE.today;
  $('backToday').classList.toggle('hidden',!back);
  $('todayClass').classList.toggle('hidden',!(v==='learn'&&EXER&&!HIST));
  const kb=$('kicker');
  if(v==='sediment'){kb.textContent='SEDIMENT · 已经学会的';$('lessonTitle').textContent='沉淀'}
  else if(v==='dir'){kb.textContent='DIRECTION · 学习方向';$('lessonTitle').textContent='方向'}
  else if(v==='read'){kb.textContent='READING · 阅读原文';$('lessonTitle').textContent='阅读'}
  else if(v==='graph'){kb.textContent='GRAPH · 知识地图';$('lessonTitle').textContent='关联'}
  else if(v==='set'){kb.textContent='SETTINGS · 模型与约束';$('lessonTitle').textContent='设置'}
  else if(HIST){kb.textContent='HISTORY · 对话历史'}
  else if(EXER){kb.textContent='PRACTICE · 实操练习'}
  else{kb.textContent='LEARNING · 对话式教学'}
  $('chatbox').style.display=(v==='learn'&&!HIST)?'flex':'none';
  const dis=!!HIST;$('input').disabled=dis;
  const b=$('chatbox').querySelector('button');if(b)b.disabled=dis;
  $('input').placeholder=HIST?'历史对话只读':(EXER?'写下解法/算式，或直接贴本地文件路径交作业…':(LASTVERDICT?'本节已收尾——可继续追问，或左侧选下一个':'回答检查题，或问点什么…（Enter 发送）'));
}
function switchTab(v){
  curView=v;
  document.querySelectorAll('.sbtn').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('chatOuter').classList.toggle('hidden',v!=='learn');
  $('readView').classList.toggle('hidden',v!=='read');
  $('dirView').classList.toggle('hidden',v!=='dir');
  $('setView').classList.toggle('hidden',v!=='set');
  $('sediment').classList.toggle('hidden',v!=='sediment');
  $('graphWrap').classList.toggle('hidden',v!=='graph');
  updateChrome(v);
  if(v==='read')renderReadings();
  if(v==='dir')renderDirection();
  if(v==='set')renderSettings();
  if(v==='sediment')renderSediment();
  if(v==='graph')renderGraph();
}

async function addSubject(){
  const name=$('subjectInput').value.trim();
  if(!name){toast('先输入科目名');return}
  const btn=$('subjectBox').querySelector('button');btn.disabled=true;btn.textContent='拆课中…';
  toast('AI 正在把「'+name+'」拆成课程…（约 20 秒）');
  try{
    await api('/api/subject',{name});
    $('subjectInput').value='';
    CURRENT=null;HIST=null;EXER=null;
    await loadState();
    toast('「'+name+'」课程就绪——第一个知识点已经丢给你',3600);
    if(STATE.today)openLesson(STATE.today.id); // 显式跳出新课，不等条件分支
  }catch(e){
    toast('开课失败：'+e.message+'（输入保留，可直接重试）',4200);
  }
  btn.disabled=false;btn.textContent='开课';
}

function findLessonMeta(nodeId){
  const ls=(STATE&&STATE.curriculum||{}).lessons||[];
  return ls.find(l=>l.id===nodeId)||null;
}

// 本地缓存直开（≤2ms 级）：已有会话不碰网络
function openCached(nodeId){
  leaveHistory();
  const sess=(STATE&&STATE.sessions||{})[nodeId];
  if(!sess)return false;
  CURRENT=nodeId;LASTVERDICT=false;
  renderSidebar();
  const meta=findLessonMeta(nodeId);
  $('lessonTitle').textContent=meta?meta.title:(sess.title||'');
  renderChat(sess.messages,sess.openingMeta);
  LASTVERDICT=endsClosed(sess);
  switchTab('learn');
  return true;
}

async function openLesson(nodeId){
  leaveHistory();
  if(openCached(nodeId))return;
  CURRENT=nodeId;LASTVERDICT=false;
  renderSidebar();
  $('lessonTitle').textContent='助教备课中…';
  try{
    const r=await api('/api/tutor/open',{nodeId});
    if(!STATE.sessions)STATE.sessions={};
    STATE.sessions[nodeId]=r.session;
    $('lessonTitle').textContent=r.session.title;
    renderChat(r.session.messages,r.session.openingMeta);
    switchTab('learn');
    LASTVERDICT=endsClosed(r.session);
    if(r.isNew)toast('新知识点丢给你了——跟着助教走');
  }catch(e){ $('lessonTitle').textContent='暂时打不开'; toast('失败：'+e.message) }
}
function endsClosed(sess){return (sess.messages||[]).some(m=>m.role==='assistant'&&/\[PASS/.test(m.content))}

// 开场指令特征（旧会话无 OpeningMeta 标记时的降级识别）
function isOpeningInstruction(m){
  return m&&m.role==='user'&&typeof m.content==='string'&&m.content.indexOf('知识点：《')===0&&m.content.indexOf('现在开始教学：')>=0;
}
function renderChat(msgs,meta){
  const c=$('chat');c.innerHTML='';
  // 开场元信息条（v3）：节序号+标题+承接——开场指令本身不渲染为用户气泡
  if(meta){
    c.insertAdjacentHTML('beforeend','<div class="meta-line"><span class="no">'+String(meta.index||1).padStart(2,'0')+'</span><span class="ti">'+esc(meta.title||'')+'<span class="why">'+esc(meta.why||'')+'</span></span><span class="op">开场</span></div>');
  }
  (msgs||[]).forEach(m=>{
    if(m.role==='tool')return;          // 工具结果帧：内部数据，不入聊天气泡
    if(!m.content)return;               // 纯工具调用帧（无文本）
    if(m.role==='user'&&isOpeningInstruction(m))return; // 开场指令（新旧会话一律）：不进气泡
    c.insertAdjacentHTML('beforeend','<div class="msg '+(m.role==='assistant'?'a':'u')+'"><div class="bubble">'+fmtContent(m.content)+'</div></div>');
  });
  $('view').scrollTop=$('view').scrollHeight;
}

async function send(){
  if(HIST)return;
  if(EXER)return sendExercise($('input').value.trim());
  if(!CURRENT){toast('先回答今天的检查题，或点一道练习');return}
  const text=$('input').value.trim();if(!text)return;
  garbleWarn(text);
  $('input').value='';
  const c=$('chat');c.insertAdjacentHTML('beforeend','<div class="msg u"><div class="bubble">'+esc(text)+'</div></div>');
  c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble" id="tmpwait">…</div></div>');
  $('view').scrollTop=$('view').scrollHeight;
  try{
    const r=await api('/api/tutor/send',{nodeId:CURRENT,text});
    const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();
    const sess=STATE.sessions[CURRENT];
    if(sess)sess.messages.push({role:'user',content:text},{role:'assistant',content:r.reply});
    c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble">'+fmtContent(r.reply)+'</div></div>');
    $('view').scrollTop=$('view').scrollHeight;
    if(r.verdict&&!LASTVERDICT){LASTVERDICT=true;await loadState();toast(r.verdict==='partial'?'本节收尾（半懂记录在案）——下一节来了':'本节收尾——履历已记「知道」，可继续追问，或选下一个')}
  }catch(e){const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();toast('失败：'+e.message)}
}

// 练习作答：题目对话里发解法 → 助教批改 → [PASS] 记「用过」履历
async function sendExercise(text){
  if(!text)return;
  garbleWarn(text);
  $('input').value='';
  const c=$('chat');c.insertAdjacentHTML('beforeend','<div class="msg u"><div class="bubble">'+esc(text)+'</div></div>');
  c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble" id="tmpwait">批改中…</div></div>');
  $('view').scrollTop=$('view').scrollHeight;
  try{
    const r=await api('/api/exercise/answer',{id:EXER,text});
    const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();
    const ex=(STATE.exercises||[]).find(x=>x.id===EXER);
    if(ex)ex.messages.push({role:'user',content:text},{role:'assistant',content:r.reply});
    c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble">'+fmtContent(r.reply)+'</div></div>');
    $('view').scrollTop=$('view').scrollHeight;
    if(r.verdict){await loadState();toast('这道练习过了——履历记「用过」')}
  }catch(e){const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();toast('失败：'+e.message)}
}

async function loadState(){
  STATE=await api('/api/state');
  renderSidebar();
  renderToday();
  api('/api/review/due').then(d=>{FSDUE=d.cards||[];renderSidebar();}).catch(()=>{});
  if(!CURRENT&&!HIST&&!EXER&&STATE.today){if(!openCached(STATE.today.id))openLesson(STATE.today.id)}
}
/* ---------- FSRS 到期复习（评审 P1-5） ---------- */
let FSDUE=[],REV=null;
function openReview(id){
  const c=(FSDUE||[]).find(x=>x.id===id);if(!c)return;
  leaveHistory();
  REV=id;CURRENT=null;EXER=null;
  $('lessonTitle').textContent=c.title||c.id;
  $('kicker').textContent='REVIEW · 到期复习';
  const pv=c.previews||{};
  const btn=(r,label)=>"<button class=\"backbtn\" onclick=\"reviewRate('"+c.id+"',"+r+")\" style=\"margin:0 6px 8px 0\">"+label+(pv[String(r)]?"<div style=\"font-size:10.5px;color:var(--mut)\">下次 "+esc(pv[String(r)])+"</div>":"")+"</button>";
  $('chat').innerHTML='<div class="msg a"><div class="bubble"><b>《'+esc(c.title||c.id)+'》到期了。</b><br>先凭记忆想一想它讲了什么、能怎么用——然后诚实自评（自评准，安排才准）：<div style="margin-top:12px">'
    +btn(1,'忘了')+btn(2,'想不起来')+btn(3,'想起来')+btn(4,'轻松')+'</div>'
    +'<div class="mut" style="font-size:11.5px;margin-top:6px">想不起来的话，点左上回历史重看这节课的对话再评。</div></div></div>';
  switchTab('learn');
}
async function reviewRate(id,rating){
  try{
    await api('/api/complete-review',{id,rating});
    FSDUE=(FSDUE||[]).filter(x=>x.id!==id);
    REV=null;
    toast('复习完成——间隔已按你的记忆重新安排');
    renderSidebar();
    if(FSDUE.length)openReview(FSDUE[0].id);
    else{renderChat([{role:'assistant',content:'今天的到期复习清空了——遗忘防御上膛。继续推进新课或做练习都行。'}]);}
  }catch(e){toast('失败：'+e.message)}
}
async function completeMain(btn){
  const title=btn.dataset.t;
  try{
    await api('/api/complete-main',{title});
    toast('产出物推进完成——履历记「做过」');
    btn.disabled=true;btn.textContent='✓';
    await loadState();
  }catch(e){toast('失败：'+e.message)}
}
async function mood(wantMore){
  const completed=(STATE.exercises||[]).length>0&&(STATE.exercises||[]).every(e=>e.status==='done');
  try{
    await api('/api/mood',{mood:wantMore?'还想来':'今天够了',completed:completed});
    toast(wantMore?'好——明天继续。':'收工愉快，休息也是正当的。');
    renderToday();
  }catch(e){toast('失败：'+e.message)}
}
// 方向卡：我在哪 · 为什么学这个 · 接下来做什么（规则驱动，零延迟）
/* ---------- 学习页 v3：状态卡 + 今日折叠条 + 航路/清单（替换原方向卡+推进卡双卡） ---------- */
let TODAYFOLD=localStorage.getItem('todayFold')==='1';
function renderToday(){
  const gc=$('guideCard');if(!gc)return;
  const planEl=document.getElementById('planCard');if(planEl)planEl.innerHTML='';
  if(!STATE.curriculum||!(STATE.curriculum.lessons||[]).length){gc.innerHTML='';return}
  const lessons=STATE.curriculum.lessons||[];
  const doneN=lessons.filter(l=>l.status==='done').length;
  const today=STATE.today;
  const idx=lessons.findIndex(l=>today&&l.id===today.id);
  const cur=idx>=0?lessons[idx]:null;
  const prev=idx>0?lessons[idx-1]:null;
  const ex=STATE.exercises||[];
  const exLeft=ex.filter(e=>e.status!=='done').length;
  const dueN=(FSDUE||[]).length;
  const main=(STATE.plan&&STATE.plan.Main)||[];
  const goals=STATE.goals||[];
  let pct=0;
  if(goals.length>=3){
    const t0=new Date(new Date(goals[0].deadline).getTime()-21*864e5),t1=new Date(goals[2].deadline),now=new Date();
    if(t1>t0)pct=Math.max(0,Math.min(100,Math.round((now-t0)/(t1-t0)*100)));
  }
  const dateStr=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
  const subj=(STATE.curriculum.subjects||[]).join('、');
  let h='<div class="status">'
    +'<span class="seg"><span class="k">日期</span><b>'+esc(dateStr)+'</b></span>'
    +'<span class="seg"><span class="k">在学</span><b>'+esc(subj)+'</b></span>'
    +'<span class="seg"><span class="k">课程进度</span><span class="big">'+(idx+1||doneN||1)+'<i> / '+lessons.length+'</i></span></span>'
    +'<span class="seg"><span class="k">冲刺</span><span class="big accent" style="font-size:16px">⛵ '+pct+'%</span></span>'
    +'</div>';
  h+='<div class="today">';
  h+='<div class="tcollapsed" onclick="toggleToday()">';
  h+='<div class="chip'+(cur?' current':'')+'"><span class="n">01</span>学 · '+esc(cur?cur.title:'开新课')+'</div><span class="asep">→</span>';
  h+='<div class="chip"><span class="n">02</span>练'+(exLeft?' <span class="cnt">'+exLeft+'</span>':'')+'</div><span class="asep">→</span>';
  h+='<div class="chip"><span class="n">03</span>复习'+(dueN?' <span class="cnt">'+dueN+'</span>':'')+'</div><span class="asep">→</span>';
  h+='<div class="chip"><span class="n">04</span>推进'+(main[0]&&main[0].Title?' · '+esc(String(main[0].Title).slice(0,10)):'')+'</div>';
  h+='<div class="tright"><div class="mroute"><span class="dot done"></span><span class="bar"></span><span class="ship">⛵</span><span class="bar"></span><span class="dot"></span><span class="bar"></span><span class="dot"></span><span style="margin-left:4px">'+pct+'%</span></div><span class="xbtn">'+(TODAYFOLD?'▴ 收起今日':'▾ 展开今日')+'</span></div>';
  h+='</div>';
  if(TODAYFOLD){
    h+='<div class="xexpanded">';
    h+='<div class="xhint"><span onclick="toggleToday()">▴ 收起今日</span></div>';
    if(goals.length>=3){
      const ps=[{p:0,done:pct>0,lb:'<b>启航</b>'},
                {p:33,done:pct>=33,lb:'<b>'+esc(goals[0].id)+' '+esc(goals[0].title)+'</b>'+String(goals[0].deadline).slice(5)},
                {p:66,done:pct>=66,lb:'<b>'+esc(goals[1].id)+' '+esc(goals[1].title)+'</b>'+String(goals[1].deadline).slice(5)},
                {p:100,done:pct>=100,lb:'<b>'+esc(goals[2].id)+' '+esc(goals[2].title)+'</b>'+String(goals[2].deadline).slice(5)}];
      h+='<div class="voyage"><div class="sea"></div>';

/* ---------- 阅读：原文/中文对照的阅读管理器 ---------- */
let READING=null;
function mdRender(t){
  let h=esc(t);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>');
  h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^- (.*)$/gm,'• $1<br>');
  return h;
}

/* ---------- 关联图：力导向 ---------- */
/* ---------- 关联图：弧线图（课程序为轴，练习真实调用为弧） ---------- */
let GNODES=[];
/* ---------- 关联图 v3：Obsidian 式视觉编码（大小=热度 · hover=聚焦邻域 · 曲线边=关系） ---------- */
let GRAPH_MOUSE=null; // hover 状态（mousemove 触发重绘）
async function renderGraph(){
  GNODES=[];
  GRAPH_MOUSE=null;
  const g=await api('/api/graph');
  // 入图资格=教学收尾（status done）
  const learned={};
  ((STATE.curriculum||{}).lessons||[]).forEach(l=>{if(l.status==='done')learned[l.id]=true});
  const nodes=(g.nodes||[]).filter(n=>learned[n.id]).filter((n,i,arr)=>arr.findIndex(m=>m.id===n.id)===i);
  const ctxEdges=(g.edges||[]).filter(e=>e.type==='context'&&learned[e.from]&&learned[e.to]);
  const seqEdges=(g.edges||[]).filter(e=>e.type==='sequence'&&learned[e.from]&&learned[e.to]);
  try{
    window.__graphErr='drawing';
    await new Promise(r=>setTimeout(r,60)); // 布局兜底。不用 rAF：后台页 rAF 会被节流
    const cv=$('graphCanvas');
    if(!cv||!cv.clientWidth){await new Promise(r=>setTimeout(r,60));}
    if(!cv||!cv.clientWidth)throw new Error('画布无尺寸');
    const dpr=window.devicePixelRatio||1;
    cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
    cv.style.width=cv.clientWidth+'px';cv.style.height=cv.clientHeight+'px';
    const ctx=cv.getContext('2d');
    // ---- 布局：FR 力导向（合力+退火位移，数学有界）----
    const W=cv.clientWidth,H=cv.clientHeight;
    nodes.forEach((n,i)=>{const ang=i/nodes.length*Math.PI*2;n.x=W/2+Math.cos(ang)*W*0.26;n.y=H/2+Math.sin(ang)*H*0.26;});
    const byId={};nodes.forEach(n=>byId[n.id]=n);
    nodes.forEach((n,i)=>{n.idx=i;}); // 力循环索引（丢失时 fX[undefined] 会把全场坐标污染成 NaN）
    // 度=真实调用热度（强边权重和）——节点大小与标签亮度都编码它
    const heat={};nodes.forEach(n=>heat[n.id]=0);
    ctxEdges.forEach(e=>{if(heat[e.from]!==undefined)heat[e.from]+= (e.weight||1);if(heat[e.to]!==undefined)heat[e.to]+=(e.weight||1);});
    const rad=id=>{const h=heat[id]||0;return 4.5+Math.min(h,8)*0.35;};
    const fX=nodes.map(()=>0),fY=nodes.map(()=>0);
    for(let it=0;it<380;it++){
      const temp=90*(1-it/380)+5;
      fX.fill(0);fY.fill(0);
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y;
        let d=Math.hypot(dx,dy);if(d<1)d=1;
        const f=(9000+(rad(nodes[i].id)+rad(nodes[j].id))*90)/(d*d),ux=dx/d,uy=dy/d;
        fX[i]-=ux*f;fY[i]-=uy*f;fX[j]+=ux*f;fY[j]+=uy*f;
      }
      ctxEdges.forEach(e=>{
        const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
        const dx=b.x-a.x,dy=b.y-a.y;
        let d=Math.hypot(dx,dy);if(d<1)d=1;
        const f=(d-170)*0.016;
        fX[a.idx]+=dx/d*f;fY[a.idx]+=dy/d*f;
        fX[b.idx]-=dx/d*f;fY[b.idx]-=dy/d*f;
      });
      seqEdges.forEach(e=>{
        const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
        const dx=b.x-a.x,dy=b.y-a.y;
        let d=Math.hypot(dx,dy);if(d<1)d=1;
        const f=(d-160)*0.010;
        fX[a.idx]+=dx/d*f;fY[a.idx]+=dy/d*f;
        fX[b.idx]-=dx/d*f;fY[b.idx]-=dy/d*f;
      });
      nodes.forEach(n=>{
        const df=Math.hypot(fX[n.idx],fY[n.idx]);
        const cl=df>temp?temp/df:1;
        n.x+=fX[n.idx]*cl;n.y+=fY[n.idx]*cl;
        n.x+=(W/2-n.x)*0.004;n.y+=(H/2-n.y)*0.004;
        n.x=Math.max(rad(n.id)+16,Math.min(W-rad(n.id)-16,n.x));
        n.y=Math.max(rad(n.id)+58,Math.min(H-rad(n.id)-70,n.y));
      });
    }
    // ---- 绘制（可被 hover 状态重复调用）----
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      const focus=GRAPH_MOUSE;
      const adj=id=>focus&&(id===focus||ctxEdges.some(e=>(e.from===focus&&e.to===id)||(e.to===focus&&e.from===id))||seqEdges.some(e=>(e.from===focus&&e.to===id)||(e.to===focus&&e.from===id)));
      // 边：默认若有若无；hover 时焦点连线变蓝
      const edge=(e,color,width)=>{
        const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
        const on=focus&&(e.from===focus||e.to===focus);
        ctx.globalAlpha=focus?(on?1:0.06):1;
        ctx.strokeStyle=on?'#0071e3':color;
        ctx.lineWidth=on?1.6:width;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        ctx.globalAlpha=1;
      };
      seqEdges.forEach(e=>edge(e,'rgba(0,0,0,.07)',1));
      ctxEdges.forEach(e=>edge(e,'rgba(0,0,0,.16)',1));
      // 节点：小圆点 + 下方细字标签（未 hover 时安静灰）
      GNODES=[];
      nodes.forEach(n=>{
        const r=rad(n.id);
        const on=focus&&(n.id===focus||adj(n.id));
        const dim=focus&&!on;
        ctx.globalAlpha=focus?(on?1:0.1):0.85;
        ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);
        ctx.fillStyle=focus&&n.id===focus?'#0071e3':(on?'#3b82c4':'#98a1ab');
        ctx.fill();
        const t=String(n.title||'');
        const label=t.length>16?t.slice(0,16)+'…':t;
        ctx.font=(focus&&n.id===focus)?'600 12.5px system-ui':'12px system-ui';
        ctx.fillStyle=focus?(n.id===focus?'#1d1d1f':(adj(n.id)?'#0071e3':'rgba(0,0,0,.3)')):'#6f7883';
        ctx.textAlign='center';
        ctx.fillText(label,n.x,n.y+r+14);
        ctx.globalAlpha=1;
        GNODES.push({id:n.id,x:n.x,y:n.y,r:r});
      });
    };
    draw();
    // ---- hover 交互：聚焦邻域 + DOM tooltip ----
    let tip=document.getElementById('graphTip');
    if(!tip){
      tip=document.createElement('div');tip.id='graphTip';
      tip.style.cssText='position:absolute;pointer-events:none;display:none;background:rgba(28,28,30,.88);backdrop-filter:blur(10px);color:#fff;font:12.5px system-ui;padding:7px 11px;border-radius:9px;z-index:5;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2)';
      cv.parentElement.appendChild(tip);
    }
    cv.onmousemove=ev=>{
      const rect=cv.getBoundingClientRect();
      const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
      const hit=GNODES.find(n=>Math.hypot(n.x-mx,n.y-my)<=Math.max(n.r+8,12));
      const changed=(hit?hit.id:null)!==GRAPH_MOUSE;
      GRAPH_MOUSE=hit?hit.id:null;
      if(changed)draw();
      if(hit){
        const t=byId[hit.id]||{};
        tip.innerHTML='<b>'+t.title.replace(/</g,'&lt;')+'</b><br>已收尾 · 被练习调用 '+ (heat[hit.id]||0) +' 次';
        tip.style.display='block';
        tip.style.left=(ev.clientX-rect.left+16)+'px';
        tip.style.top=(ev.clientY-rect.top+10)+'px';
        cv.style.cursor='pointer';
      }else{
        tip.style.display='none';
        cv.style.cursor='default';
      }
    };
    cv.onmouseleave=()=>{GRAPH_MOUSE=null;draw();tip.style.display='none';};
    window.__graphErr='';
  }catch(err){const m=String(err&&err.message||err);window.__graphErr=m;toast('关联图渲染失败：'+m)}
  // 点击命中 → 回到对应对话
  const cv2=$('graphCanvas');
  cv2.onclick=ev=>{
    const rect=cv2.getBoundingClientRect();
    const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
    const hit=GNODES.find(n=>Math.hypot(n.x-mx,n.y-my)<=Math.max(n.r+8,12));
    if(hit)jumpLesson(hit.id);else toast('这个知识点还没开课——完成前序知识它就来了');
  };
}
