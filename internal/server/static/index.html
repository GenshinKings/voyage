<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前哨 2.0 · 全托管学习机</title>
<style>
:root{
  --ink:#101b29;--paper:#f7f7f5;--side:rgba(255,255,255,.72);--line:#e3e6ea;--mut:#8a92a0;
  --pink:#FB7299;--gold:#D9A441;--usr:#101b29;--green:#34c759;--card:#fff;--chip:rgba(16,27,41,.045);
  --num-font:"Bahnschrift","Segoe UI",sans-serif;
  --shadow-contact:0 1px 2px rgba(16,27,41,.06),0 0 0 1px rgba(16,27,41,.03);
  --r-lg:12px;--r-md:9px;--r-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
#side{width:256px;background:var(--side);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid rgba(0,0,0,.06)}
#side .logo{padding:20px 18px 12px}
#side .logo .kicker{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:600;text-transform:uppercase}
#side .logo b{font-size:17px;letter-spacing:-.02em;display:block;margin-top:2px}
.sidebtns{padding:4px 10px 8px}
.sbtn{padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13.5px;margin-bottom:1px;transition:background 120ms ease-out,color 120ms ease-out,transform 100ms ease-out;user-select:none}
.sbtn:hover{background:var(--chip);color:var(--ink)}
.sbtn:active{transform:scale(.97)}
.sbtn.on{color:var(--pink);background:var(--sel);font-weight:600}
#subjectBox{padding:6px 14px 14px;display:flex;gap:8px}
#subjectBox input{flex:1;min-width:0;border:1px solid rgba(0,0,0,.12);padding:7px 11px;font:inherit;font-size:13px;border-radius:9px;outline:none;background:#fff;transition:border-color 150ms,box-shadow 150ms}
#subjectBox input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#subjectBox button{border:none;background:var(--pink);color:#fff;padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;transition:transform 100ms ease-out,filter 150ms}
#subjectBox button:active{transform:scale(.96);filter:brightness(.92)}
#lessonList{flex:1;overflow-y:auto;padding:4px 10px}
.gc-form{display:flex;flex-direction:column;gap:8px}
.gc-form input{border:1px solid rgba(0,0,0,.12);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;outline:none;background:#fff}
.gc-form input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#agentsEdit{width:100%;min-height:260px;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:14px;font:12.5px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:none;background:#fff;resize:vertical}
#agentsEdit:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(0,113,227,.18)}
#subjFoot{padding:12px 18px;border-top:1px solid rgba(0,0,0,.06);font-size:12px;color:var(--mut);flex-shrink:0;line-height:1.6}
#subjFoot b{color:var(--ink);font-weight:600}
.grouplabel{font-size:11px;letter-spacing:.05em;color:var(--mut);margin:14px 8px 4px;font-weight:600}
.lp{padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:1px;display:flex;align-items:center;gap:8px;transition:background 120ms ease-out,transform 100ms ease-out;user-select:none}
.lp .lp-sub{font-size:11px;color:var(--mut);font-weight:400;margin-top:1px;letter-spacing:0}
.lp:hover{background:var(--chip)}
.lp:active{transform:scale(.98)}
.lp .st{font-size:11px;flex-shrink:0;width:14px;color:var(--mut)}
.lp.done .st{color:var(--green)}
.lp.today .st{color:var(--pink);font-weight:700}
.lp.on{background:rgba(0,113,227,.1);font-weight:600}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:rgba(245,245,247,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(0,0,0,.05)}
#topbar .kicker{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:600;text-transform:uppercase}
#topbar h1{font-size:20px;letter-spacing:-.02em;line-height:1.15;margin-top:1px}
.backbtn{border:1px solid rgba(0,113,227,.35);background:rgba(0,113,227,.08);color:var(--pink);padding:6px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:transform 100ms ease-out,background 150ms}
.backbtn:hover{background:rgba(0,113,227,.14)}
.backbtn:active{transform:scale(.96)}
#view{flex:1;overflow-y:auto;padding:84px 0 0}
#chat{max-width:min(920px,100%);margin:0 auto;padding:0 28px 130px}
.msg{margin:14px 0;display:flex;animation:msgIn 260ms cubic-bezier(.2,.8,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#guideCard{max-width:880px;margin:6px auto 2px;padding:0 28px}
/* ===== 学习页 v3：状态卡 / 折叠条 / 航路 / 清单 ===== */
#guideCard .status{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;background:var(--card);border-radius:var(--r-md);padding:12px 18px;box-shadow:var(--shadow-contact);font-size:14px}
#guideCard .status .seg{display:flex;align-items:baseline;gap:7px;color:var(--ink-soft)}
#guideCard .status .k{font-size:10.5px;letter-spacing:2px;color:var(--mut)}
#guideCard .status b{font-weight:700;color:var(--ink)}
#guideCard .status .big{font-size:26px;font-weight:800;color:var(--ink);line-height:1;font-family:var(--num-font)}
#guideCard .status .big i{font-style:normal;font-size:14px;color:var(--mut);font-weight:400}
#guideCard .status .accent{color:var(--pink)}
#guideCard .today{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
#guideCard .tcollapsed{display:flex;align-items:center;gap:6px;padding:12px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
#guideCard .chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px solid transparent;white-space:nowrap}
#guideCard .chip:hover{border-color:var(--line)}
#guideCard .chip .n{font-size:10.5px;font-weight:800;color:var(--mut)}
#guideCard .chip.current{border-color:var(--pink)}
#guideCard .chip.current .n{color:var(--pink)}
#guideCard .chip .cnt{font-size:11px;color:var(--pink);font-weight:700}
#guideCard .asep{color:#c9d0d9;font-size:12px}
#guideCard .tright{margin-left:auto;display:flex;align-items:center;gap:12px}
#guideCard .mroute{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
#guideCard .mroute .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
#guideCard .mroute .dot.done{background:var(--ink)}
#guideCard .mroute .bar{width:20px;height:1.5px;background:var(--line)}
#guideCard .mroute .ship{color:var(--pink);font-size:13px}
#guideCard .xbtn{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;background:var(--card);white-space:nowrap}
#guideCard .xbtn:hover{color:var(--ink);border-color:var(--ink)}
#guideCard .xexpanded{border-top:1px solid var(--line)}
#guideCard .xhint{display:flex;justify-content:flex-end;padding:8px 16px 0}
#guideCard .xhint span{font-size:11.5px;color:var(--mut);cursor:pointer}
#guideCard .xhint span:hover{color:var(--ink)}
#guideCard .voyage{position:relative;height:60px;margin:14px 16px 0}
#guideCard .voyage .sea{position:absolute;left:0;right:0;top:28px;border-top:1.5px dashed #c9d0d9}
#guideCard .voyage .port{position:absolute;top:18px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1.5px solid #b9c0ca}
#guideCard .voyage .port.done{background:var(--ink);border-color:var(--ink)}
#guideCard .voyage .port .lb{position:absolute;top:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:var(--mut)}
#guideCard .voyage .port:last-child .lb{left:auto;right:0;transform:none;text-align:right}
#guideCard .voyage .port .lb b{display:block;color:var(--ink);font-size:11px;text-align:center}
#guideCard .voyage .ship{position:absolute;top:20px;font-size:17px;transform:translateX(-50%)}
#guideCard .voyage .pct{position:absolute;top:-2px;transform:translateX(-50%);font-size:10.5px;color:var(--pink);font-weight:700}
#guideCard .tl{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-bottom:1px dashed var(--line)}
#guideCard .tl:last-of-type{border-bottom:none}
#guideCard .tl .no{font-size:30px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1px #b9c0ca;min-width:46px;font-family:var(--num-font)}
#guideCard .tl.primary .no{color:var(--pink);-webkit-text-stroke:0}
#guideCard .tl .cat{font-size:10px;letter-spacing:2px;color:var(--mut)}
#guideCard .tl .ti{font-size:15px;font-weight:600;margin-top:2px}
#guideCard .tl .why{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.6}
#guideCard .tl .act{flex-shrink:0;align-self:center;min-width:92px;text-align:right}
#guideCard .sline{display:flex;gap:20px;flex-wrap:wrap;padding:12px 16px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line)}
#guideCard .sline span b{color:var(--ink-soft)}
#guideCard .sline .warn b{color:var(--pink)}
/* 开场元条（对话流内） */
.meta-line{border-left:4px solid var(--ink);background:var(--card);border-radius:0 10px 10px 0;padding:11px 16px;margin:0 0 16px;display:flex;align-items:baseline;gap:13px;box-shadow:0 1px 2px rgba(16,27,41,.04)}
.meta-line .no{font-size:22px;font-weight:800;color:transparent;-webkit-text-stroke:1px #b9c0ca;line-height:1;font-family:var(--num-font)}
.meta-line .ti{font-size:14.5px;font-weight:600;color:var(--ink)}
.meta-line .ti .why{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:3px}
.meta-line .op{margin-left:auto;letter-spacing:2px;font-size:10.5px;color:#9aa2af;flex-shrink:0}
#planCard{max-width:min(920px,100%);margin:8px auto 2px;padding:0 28px}
#planCard .pc{background:var(--card);border-radius:12px;padding:12px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);font-size:12.5px}
#planCard .pc-goals{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut)}
#planCard .pc-goals b{color:var(--ink);font-weight:600}
#planCard .pc-main{margin-top:8px;line-height:1.7}
#planCard .pc-item{display:flex;align-items:center;gap:8px;padding:3px 0}
#planCard .pc-item .backbtn{padding:2px 10px;font-size:11.5px}
#planCard .pc-mood{margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:8px;align-items:center;color:var(--mut)}
.rev-item{cursor:pointer}
.rev-item:hover{background:rgba(251,114,153,.06)}
#guideCard .gc{background:var(--card);border-radius:12px;padding:14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03)}
#guideCard .gc-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#guideCard .gc-prog{font-size:13px;font-weight:600;color:var(--ink)}
#guideCard .gc-prog b{font-size:15px}
#guideCard .gc-anchor{font-size:12px;color:var(--mut)}
#guideCard .gc-brief{font-size:13px;color:var(--mut);margin-top:5px;line-height:1.6}
#guideCard .gc-brief b{color:var(--ink)}
#guideCard .gc-next{font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06);line-height:1.6}
#guideCard .gc-next b{color:var(--pink);font-weight:600}
#guideCard .gc-profile{font-size:11.5px;color:var(--mut);margin-top:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guideCard .gc-profile:hover{color:var(--ink)}
#guideCard .gc-fetch{font-size:11.5px;color:var(--mut);margin-top:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guideCard .gc-fetch:hover{color:var(--ink)}
.rtag{display:inline-block;font-size:10px;color:var(--pink);border:1px solid rgba(251,114,153,.35);border-radius:6px;padding:0 5px;margin-right:5px;vertical-align:1.5px;font-weight:600}
.msg .bubble{max-width:78%;padding:11px 15px;border-radius:18px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.a .bubble{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);border-bottom-left-radius:6px}
.msg.u{justify-content:flex-end}
.msg.u .bubble{background:var(--usr);color:#fff;border-bottom-right-radius:6px}
.msg.u .bubble .mark{color:#fff}
.bubble .mark{display:block;margin-top:10px;font-weight:600;color:var(--green)}
.bubble .mark.partial{color:var(--warn)}
.bubble .mark.propose{color:var(--pink);font-size:12.5px;font-weight:600}
.msg.u .bubble .mark.partial{color:#ffd60a}
.inputbar{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:14px 28px 18px;background:rgba(245,245,247,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(0,0,0,.05)}
#chatbox{max-width:min(920px,100%);margin:0 auto;display:flex;gap:10px}
#chatbox textarea{flex:1;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:11px 15px;font:inherit;font-size:14px;resize:none;height:48px;outline:none;background:#fff;transition:border-color 150ms,box-shadow 150ms}
#chatbox textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px var(--focus)}
#chatbox button{align-self:flex-end;border:none;background:var(--pink);color:#fff;padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;transition:transform 100ms ease-out,filter 150ms}
#chatbox button:active{transform:scale(.95);filter:brightness(.92)}
.empty{color:var(--mut);text-align:center;margin-top:80px;font-size:14px;line-height:1.7}
#sediment{max-width:min(920px,100%);margin:0 auto;padding:8px 28px 130px}
.counts{display:flex;gap:36px;margin:6px 0 14px}
.counts .c .n{font-size:34px;font-weight:700;letter-spacing:-.02em}
.counts .c .l{color:var(--mut);font-size:12.5px;font-weight:500}
.item{padding:11px 0 11px 16px;border-left:3px solid rgba(0,0,0,.1);margin:6px 0}
.item.d3{border-color:var(--ink)}.item.d2{border-color:var(--pink)}.item.d1{border-color:rgba(0,0,0,.18)}
.item.clickable{cursor:pointer;transition:background 120ms ease-out}
.item.clickable:hover{background:var(--chip)}
.item .t{font-weight:600;letter-spacing:-.01em}
.item .m{color:var(--mut);font-size:12.5px;margin-top:1px}
#graphWrap{height:calc(100vh - 240px);position:relative;margin:8px 24px 20px}
#dirView{max-width:880px;margin:0 auto;padding:8px 28px 130px}
.dir-msg{margin:14px 0;display:flex}
.dir-msg .bubble{max-width:78%;padding:11px 15px;border-radius:18px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.dir-msg.a .bubble{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);border-bottom-left-radius:6px}
.dir-msg.u{justify-content:flex-end}
.dir-msg.u .bubble{background:var(--usr);color:#fff;border-bottom-right-radius:6px}
.proposal-card{background:var(--card);border:1.5px solid var(--pink);border-radius:12px;padding:16px 18px;margin:14px 0}
.proposal-card h4{font-size:15px;margin:0 0 8px}
.proposal-card ol{margin:6px 0 12px 18px;font-size:13.5px;line-height:1.8}
.dir-input{display:flex;gap:10px;margin-top:12px}
.dir-input textarea{flex:1;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:11px 15px;font:inherit;font-size:14px;height:48px;resize:none;outline:none;background:#fff}
.dir-input textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px var(--focus)}
.dir-input button{border:none;background:var(--pink);color:#fff;padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;font-weight:600}
.brief-card{background:var(--card);border-left:3px solid var(--pink);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13.5px;line-height:1.8}
/* 副本 */
.dn-stages{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.dn-stage{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.dn-stage .dn-no{font-family:var(--num-font);font-weight:800}
.dn-stage.done{color:var(--ink)}
.dn-stage.done .dn-no{color:var(--green)}
.dn-stage.cur{border-color:var(--pink);color:var(--ink);font-weight:600}
.dn-stage.cur .dn-no{color:var(--pink)}
.dn-stage .dn-done{color:var(--green)}
.dn-chat{margin-top:4px}
.dn-clear{background:#fff;border:1.5px solid var(--pink);border-radius:10px;padding:14px 18px;font-size:14px;font-weight:600;margin-bottom:16px;line-height:1.7}
.reading-body{background:var(--card);border-radius:12px;padding:22px 26px;font-size:14.5px;line-height:1.85;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03)}
.reading-body h3{font-size:17px;letter-spacing:-.01em;margin:18px 0 6px}
.reading-body h4{font-size:14.5px;margin:14px 0 4px}
.reading-body pre{background:#f6f8fa;border:1px solid rgba(0,0,0,.07);border-radius:9px;padding:12px 14px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;overflow-x:auto;margin:10px 0;white-space:pre}
.reading-body code{background:#f0f1f3;border-radius:5px;padding:1px 6px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
.reading-body pre code{background:none;padding:0}
.reading-body blockquote{border-left:3px solid var(--pink);background:rgba(0,113,227,.05);border-radius:0 8px 8px 0;padding:8px 14px;margin:10px 0;color:#3a3a3c}
.reading-original{margin-bottom:10px}
canvas{width:100%;height:100%;display:block}
.gLegend{position:absolute;top:12px;left:14px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 12px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(28,28,30,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:9px 22px;font-size:13.5px;display:none;border-radius:999px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.18);letter-spacing:.01em}
a{color:var(--pink);text-decoration:none}
a:hover{text-decoration:underline}
.mut{color:var(--mut);font-size:13px}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:99px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(0,113,227,.22)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){#side,#topbar,.inputbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}}
/* ===== 左缘装置：竖排标注 + 航路进度药丸（大屏专属，填边缘不挤内容） ===== */
#edge{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:2;display:none;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
@media (min-width:1240px){#edge{display:flex}}
#edge .vtext{writing-mode:vertical-rl;letter-spacing:6px;font-size:10px;color:#b9c0ca;font-weight:600;user-select:none}
#edge .pill{width:4px;height:160px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
#edge .pill i{position:absolute;left:0;top:0;width:100%;height:12%;background:var(--pink);border-radius:4px}
#edge .pv{font-size:10px;color:var(--pink);font-weight:700}

/* ===== 设置页样式系统（修复裸控件） ===== */
#setView{max-width:1060px;margin:0 auto;padding:8px 28px 60px}
#setView .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
#setView .set-card{background:transparent;border-radius:0;padding:4px 4px 22px;border-bottom:1px solid var(--line)}
#setView .set-card.wide{grid-column:1 / -1}
#setView .lp{background:#fff;border:1px solid var(--line)}
#setView .grouplabel{margin:0 0 10px;padding-left:10px;border-left:3px solid var(--ink);font-size:12px;letter-spacing:1px;line-height:1.5}
#setView .set-card .backbtn{margin-right:8px}
#setView input,#setView textarea,#setView select{width:100%;border:1px solid rgba(0,0,0,.12);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;outline:none;background:#fff;transition:border-color 150ms,box-shadow 150ms;box-sizing:border-box}
#setView input:focus,#setView textarea:focus,#setView select:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(251,114,153,.14)}
#setView textarea{font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;resize:vertical;min-height:150px}
#setView .backbtn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:7px 16px;font-size:12.5px;cursor:pointer;transition:.15s}
#setView .backbtn:hover{background:var(--ink);color:#fff}
#setView .backbtn.hot{border-color:var(--pink);color:var(--pink)}
#setView .backbtn.hot:hover{background:var(--pink);color:#fff}
#setView .lp{background:var(--paper);border:1px solid var(--line);margin-bottom:6px}
#setView .lp.on{border-color:var(--pink)}
#setView .mut{font-size:11.5px}
#setView pre{white-space:pre-wrap;font-size:11.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;max-height:260px;overflow-y:auto}
#setView .set-card{background:var(--card);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--shadow-contact);margin-bottom:16px}
#setView .set-card .grouplabel{border-left-color:var(--pink)}
/* ===== 副本大厅 ===== */
.dh-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:8px}
.dh-card[style*="pink"]{box-shadow:var(--shadow-contact)}
.dh-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dh-tag{font-size:10.5px;letter-spacing:2px;padding:3px 10px;border-radius:8px;background:var(--paper);color:var(--mut)}
.dh-tag.hot{background:rgba(251,114,153,.12);color:var(--pink);font-weight:700}
.dh-title{font-size:15px;font-weight:700}
.dh-item{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px dashed var(--line)}
.dh-item.dim{opacity:.75}
.dh-item>div:first-child{flex:1;min-width:0}
.dh-t{font-size:14.5px;font-weight:600}
.dh-sub{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.6}
.dh-actions{display:flex;gap:10px;margin-top:12px}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 16px;font-size:12.5px;cursor:pointer;border-radius:8px;white-space:nowrap}
.btn:hover{background:var(--ink);color:#fff}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.primary:hover{opacity:.9;background:var(--pink)}
.btn.ghost{border-color:var(--line);color:var(--mut)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}

/* ===== 影子副本（v2 悬念化，demo/shadow-dungeon 移植） ===== */
/* 影子候选卡 */
.shadow-card{display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2E2B33,#43323E);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:12px;color:#EFE9E4;transition:transform 280ms cubic-bezier(.22,.9,.32,1),box-shadow 280ms}
.shadow-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 84% 24%,rgba(251,114,153,.2),transparent 55%)}
.shadow-card:hover{transform:translateY(-3px) rotate(-.35deg);box-shadow:0 14px 30px rgba(16,27,41,.26)}
.sh-body{flex:1;min-width:0;position:relative;z-index:1}
.sh-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tier{font-size:10px;letter-spacing:1.5px;padding:3px 10px;border-radius:8px;font-weight:700}
.tier.t0{background:rgba(107,190,131,.16);color:#4C9E64}
.tier.t1{background:rgba(217,164,65,.2);color:#B07F22}
.tier.t2{background:rgba(251,114,153,.24);color:var(--pink)}
.stars{color:var(--gold);font-size:12px;letter-spacing:2.5px}
.stars .off{color:rgba(217,164,65,.28)}
.req{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.req .chip{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.15);color:#EFE9E4;border-radius:9px}
.req .chip.miss{background:rgba(217,164,65,.13);border-color:rgba(217,164,65,.42);color:#E8C477}
.sh-sub{font-size:11.5px;color:rgba(239,233,228,.55);margin-top:9px}
.sh-actions{flex:none;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sh-go{border:1px solid var(--pink);background:var(--pink);color:#fff;border-radius:9px;padding:9px 26px;font-size:13px;cursor:pointer;font-weight:700;transition:opacity 120ms,transform 100ms}
.sh-go:hover{opacity:.88}
.sh-go:active{transform:scale(.96)}
.sh-go:disabled{opacity:.4;cursor:default}
.sh-hint{font-size:10.5px;color:rgba(239,233,228,.45)}
/* 进行中卡 */
.active-card{background:var(--card);border:1.5px solid var(--pink);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:12px;box-shadow:0 4px 18px rgba(251,114,153,.1)}
.ac-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ac-tag{font-size:10px;letter-spacing:2px;padding:3px 11px;border-radius:8px;background:rgba(251,114,153,.12);color:var(--pink);font-weight:700}
.ac-title{font-size:15px;font-weight:700;letter-spacing:1px}
.pip-track{display:flex;gap:9px;margin-bottom:14px}
.pip{flex:1;height:6px;border-radius:4px;background:var(--chip);position:relative;overflow:hidden}
.pip::after{content:"";position:absolute;inset:0;background:var(--pink);border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform 600ms cubic-bezier(.22,.9,.32,1)}
.pip.done::after{transform:scaleX(1)}
.pip.cur::after{animation:pipPulse 1.3s ease-in-out infinite alternate}
@keyframes pipPulse{from{transform:scaleX(.15)}to{transform:scaleX(.72)}}
.ac-actions{display:flex;gap:10px}
/* 剪影与收藏墙 */
.silo-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.silo-slot{border:1.5px dashed var(--line);border-radius:var(--r-lg);min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--mut);transition:border-color 120ms}
.silo-slot:hover{border-color:var(--mut)}
.silo{width:46px;height:46px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 4px,transparent 4px,transparent 8px)}
.silo-slot .q{font-size:16px;font-weight:800;color:var(--line)}
.silo-slot small{font-size:11px}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tcard{background:linear-gradient(155deg,#FFFDFB,#F7EFE9);border:1.5px solid var(--pink);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;cursor:pointer;transition:transform 280ms cubic-bezier(.22,.9,.32,1),box-shadow 280ms;animation:cardIn .55s cubic-bezier(.22,.9,.32,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.tcard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(16,27,41,.14)}
.tcard::after{content:"";position:absolute;top:0;bottom:0;width:55%;left:-70%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-18deg)}
.tcard:hover::after{animation:cardShimmer 1s cubic-bezier(.22,.9,.32,1)}
@keyframes cardShimmer{to{left:135%}}
.t-badge{font-size:9.5px;letter-spacing:2px;color:var(--pink);font-weight:700}
.t-name{font-size:16px;font-weight:800;margin:5px 0 4px}
.t-impact{font-size:11.5px;color:var(--ink);opacity:.75;line-height:1.7;max-width:78%}
.t-meta{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.t-meta span{font-size:10.5px;padding:3px 10px;border-radius:8px;background:rgba(251,114,153,.12);color:var(--pink);font-weight:600}
.t-date{position:absolute;top:15px;right:15px;width:60px;height:60px;border:1.5px solid var(--pink);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8.5px;color:var(--pink);font-weight:700;line-height:1.4;transform:rotate(-9deg);letter-spacing:.5px}
/* 卡详情 */
.tdetail{position:fixed;inset:0;background:rgba(24,21,26,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:90;animation:tdFade 280ms both}
@keyframes tdFade{from{opacity:0}to{opacity:1}}
.td-card{width:400px;max-width:92vw;background:linear-gradient(155deg,#FFFDFB,#F7EFE9);border:1.5px solid var(--pink);border-radius:16px;padding:26px 28px;position:relative;animation:tdIn 450ms cubic-bezier(.2,.8,.3,1.12) both}
@keyframes tdIn{from{opacity:0;transform:perspective(1000px) rotateY(55deg) scale(.9)}to{opacity:1;transform:perspective(1000px) rotateY(0) scale(1)}}
.td-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:13px;line-height:1}
.td-close:hover{color:var(--ink);border-color:var(--ink)}
.td-name{font-size:22px;font-weight:800;margin:6px 0 2px}
.td-repo{font-size:12px;color:var(--mut);margin-bottom:10px}
.td-impact{font-size:13px;color:var(--ink);opacity:.8;line-height:1.8}
.td-node{font-size:11.5px;padding:3px 11px;border-radius:8px;background:rgba(251,114,153,.12);color:var(--pink);font-weight:600;display:inline-block;margin:0 6px 6px 0;cursor:pointer}
.td-node:hover{background:var(--pink);color:#fff}
.td-cleared{font-size:11px;color:var(--mut)}
/* 开门雾散 */
.fog{position:fixed;inset:0;z-index:88;pointer-events:none;background:radial-gradient(ellipse at 30% 40%,rgba(67,50,62,.97),transparent 60%),radial-gradient(ellipse at 72% 60%,rgba(46,43,51,.97),transparent 62%),rgba(30,27,33,.98);opacity:0}
.fog.play{animation:fogPlay .95s cubic-bezier(.22,.9,.32,1) both}
@keyframes fogPlay{0%{opacity:0}32%{opacity:1}66%{opacity:1}100%{opacity:0}}
.fog .fog-q{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;letter-spacing:8px;color:rgba(239,233,228,.85);font-weight:700;opacity:0;animation:fogQ .95s both}
@keyframes fogQ{20%{opacity:1}58%{opacity:1;letter-spacing:11px}100%{opacity:0;letter-spacing:15px}}
/* 一锤揭晓（时序：暗场.35 → 碎片.7 → flip.7 → shimmer → 文案 → 按钮） */
.reveal{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,rgba(56,44,52,.985),rgba(22,19,24,.99));opacity:0;pointer-events:none;transition:opacity 350ms cubic-bezier(.22,.9,.32,1)}
.reveal.show{opacity:1;pointer-events:auto}
.rv-qs{font-size:46px;font-weight:800;letter-spacing:12px;color:#EFE9E4;height:80px;user-select:none}
.rv-qs span{display:inline-block}
.reveal.revealing .rv-qs span{animation:shatter .72s cubic-bezier(.22,.9,.32,1) forwards}
.rv-qs span:nth-child(1){--dx:-150px;--dy:-96px;--dr:-48deg;animation-delay:.05s}
.rv-qs span:nth-child(2){--dx:130px;--dy:-118px;--dr:40deg;animation-delay:.13s}
.rv-qs span:nth-child(3){--dx:-95px;--dy:110px;--dr:52deg;animation-delay:.21s}
.rv-qs span:nth-child(4){--dx:155px;--dy:80px;--dr:-36deg;animation-delay:.29s}
.rv-qs span:nth-child(5){--dx:8px;--dy:-150px;--dr:26deg;animation-delay:.37s}
@keyframes shatter{to{transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(1.5);opacity:0;filter:blur(4px)}}
.rv-card{width:360px;max-width:90vw;position:relative;overflow:hidden;background:linear-gradient(155deg,#FFFDFB,#F7EFE9);border:1.5px solid var(--pink);border-radius:16px;padding:24px 26px;opacity:0;transform:perspective(1000px) rotateY(92deg)}
.reveal.revealing .rv-card{animation:cardFlip .72s .5s cubic-bezier(.2,.8,.3,1.12) forwards}
@keyframes cardFlip{to{opacity:1;transform:perspective(1000px) rotateY(0)}}
.rv-card::after{content:"";position:absolute;top:0;bottom:0;width:55%;left:-70%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.78),transparent);transform:skewX(-18deg)}
.reveal.revealing .rv-card::after{animation:cardShimmer 1.05s 1.15s cubic-bezier(.22,.9,.32,1) forwards}
.rv-text{text-align:center;color:#EFE9E4;margin-top:18px;min-height:58px}
.rv-text b{font-size:17px;display:block}
.rv-text small{display:block;font-size:11.5px;color:rgba(239,233,228,.62);margin-top:4px}
.reveal.revealing .rv-text{animation:bubIn .5s 1.35s both}
@keyframes bubIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv-go{margin-top:16px;border:1px solid var(--pink);background:transparent;color:#F894B4;border-radius:9px;padding:9px 26px;font-size:13px;cursor:pointer;font-weight:600;opacity:0}
.rv-go:hover{background:rgba(251,114,153,.12)}
.reveal.revealing .rv-go{animation:bubIn .4s 1.9s both}
.rv-mote{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--pink);opacity:0;pointer-events:none}
.reveal.revealing .rv-mote{animation:mote 1.6s cubic-bezier(.22,.9,.32,1) both}
@keyframes mote{0%{opacity:0;transform:translateY(0) scale(1)}25%{opacity:.85}100%{opacity:0;transform:translateY(-130px) scale(.4)}}
/* 沉淀连锚 */
.anchor-svg{width:100%;max-width:720px;height:auto;display:block}
.an-ctx{stroke:#C9C2B9;stroke-width:1.4;opacity:.65;fill:none}
.an-earned{stroke:var(--pink);stroke-width:1.7;stroke-dasharray:6 4;opacity:.8;fill:none;animation:dashFlow 1.7s linear infinite}
@keyframes dashFlow{to{stroke-dashoffset:-20}}
.an-node{fill:#fff;stroke:var(--line);stroke-width:1.5}
.an-tro{fill:#FFF6F2;stroke:var(--pink);stroke-width:2}
.an-label{font-size:11.5px;fill:var(--ink)}
.an-sub{font-size:10px;fill:var(--mut)}
.an-note{font-size:10.5px;fill:var(--mut);letter-spacing:1px}

/* ===== UI 评审 P0 批次（小穗评审 2026-10-27） ===== */
/* P0-5 颜色语义 token：通过=绿 / 待验证=琥珀 / 未通过=红；选中=中性灰 */
:root{--warn:#B07F22;--bad:#E5484D;--sel:rgba(16,27,41,.055);--focus:rgba(251,114,153,.18)}
.msg.u .bubble .mark{color:#B9E8C5}
.lp.on{background:var(--sel)}
#subjectBox input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px var(--focus)}
.gc-form input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px var(--focus)}
#agentsEdit:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px var(--focus)}
/* P0-1 判定出口动作条 */
.verdict-actions{display:flex;gap:9px;margin:2px 0 14px;align-items:center}
.verdict-actions .va{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 16px;font-size:12.5px;border-radius:9px;cursor:pointer;transition:all 120ms ease-out}
.verdict-actions .va:hover{border-color:var(--ink)}
.verdict-actions .va.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.verdict-actions .va.primary:hover{opacity:.88}
.verdict-actions .va-hint{font-size:11px;color:var(--mut)}
/* P0-3 进度页 tab */
#progressTabs{display:flex;gap:6px;max-width:920px;margin:6px auto 14px;padding:0 24px}
.ptab{border:1px solid var(--line);background:transparent;color:var(--mut);padding:7px 18px;font-size:12.5px;border-radius:9px;cursor:pointer;transition:all 120ms}
.ptab:hover{color:var(--ink);border-color:var(--ink)}
.ptab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
/* P0-4 列宽弹性（正文列 736→920 封顶弹性） */
/* P0-4 <1200 侧栏收图标 */
@media (max-width:1200px){
  #side{width:64px;padding:16px 8px}
  #side .logo .kicker,#side .logo b,#lessonList,#subjFoot{display:none}
  #subjectBox input,#subjectBox button:first-of-type{display:none}
  #subjectBox .sb-plus{display:inline-block;flex:1;text-align:center;font-size:18px;padding:8px 0}
.sb-plus{display:none}
  .sbtn-t{display:none}
  .sbtn{font-size:17px;padding:10px 0 10px 24px}
  .sidebtns{margin-top:20px}
  .side-foot{display:none}
  .logo{padding-bottom:14px;border-bottom:1px solid var(--line)}
}

/* ===== 桌面端专项（评审补充） ===== */
/* 深色模式：变量整套覆盖 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --ink:#E4E6EB;--usr:#E4E6EB;--paper:#17191E;--card:#1F2229;--side:rgba(24,26,32,.86);
    --line:#2E323B;--mut:#8B919C;--chip:rgba(228,230,235,.06);--sel:rgba(228,230,235,.08);
    --shadow-contact:0 1px 2px rgba(0,0,0,.5),0 0 0 1px rgba(228,230,235,.04);
  }
  :root:not([data-theme=light]) body{background:var(--paper);color:var(--ink)}
  :root:not([data-theme=light]) .msg .bubble{background:var(--card);color:var(--ink)}
  :root:not([data-theme=light]) .msg.u .bubble{background:#2A2E37;color:#E4E6EB}
  :root:not([data-theme=light]) .tcard,.td-card,.rv-card{background:linear-gradient(155deg,#241F23,#2B2229)}
  :root:not([data-theme=light]) .t-impact,.td-impact{color:#D8D3CE}
  :root:not([data-theme=light]) .shadow-card{background:linear-gradient(135deg,#232028,#2E2430)}
  :root:not([data-theme=light]) .silo{background:repeating-linear-gradient(45deg,#24262C,#24262C 4px,transparent 4px,transparent 8px)}
  :root:not([data-theme=light]) .active-card,.verdict-actions .va{background:var(--card)}
  :root:not([data-theme=light]) #input,#subjectBox input{background:var(--card);color:var(--ink);border-color:var(--line)}
  :root:not([data-theme=light]) #guideCard .status,.dn-clear{background:var(--chip)}
  :root:not([data-theme=light]) #topbar{background:rgba(23,25,30,.78);border-bottom-color:rgba(228,230,235,.06)}
  :root:not([data-theme=light]) .inputbar{background:var(--paper);border-top-color:rgba(228,230,235,.06)}
  :root:not([data-theme=light]) #chatbox textarea{background:var(--card);color:var(--ink);border-color:var(--line)}
  :root:not([data-theme=light]) #chatbox #input,#subjectBox button{background:var(--pink)}
  :root:not([data-theme=light]) #side{background:var(--side)}
  :root:not([data-theme=light]) .bubble,.dn-bubble{background:var(--card);color:var(--ink)}
  :root:not([data-theme=light]) .gLegend{color:var(--mut)}
}
/* 命令面板 */
.palette{position:fixed;inset:0;background:rgba(10,11,14,.55);backdrop-filter:blur(2px);z-index:120;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh}
.pal-box{width:560px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;animation:palIn 160ms cubic-bezier(.22,.9,.32,1) both}
@keyframes palIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.pal-box input{width:100%;border:none;outline:none;padding:15px 18px;font:inherit;font-size:14.5px;background:transparent;color:var(--ink);border-bottom:1px solid var(--line)}
.pal-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13.5px}
.pal-item:hover,.pal-item.hot{background:var(--sel)}
.pal-item .pi-ico{width:20px;text-align:center;color:var(--pink);flex:none}
.pal-item .pi-sub{margin-left:auto;font-size:11px;color:var(--mut)}
.pal-empty{padding:18px;text-align:center;color:var(--mut);font-size:12.5px}
.pal-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mut);display:flex;gap:14px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px;font-family:var(--num-font,monospace)}
:root[data-theme=dark]{
    --ink:#E4E6EB;--usr:#E4E6EB;--paper:#17191E;--card:#1F2229;--side:rgba(24,26,32,.86);
    --line:#2E323B;--mut:#8B919C;--chip:rgba(228,230,235,.06);--sel:rgba(228,230,235,.08);

  }
[data-theme=dark] body{background:var(--paper);color:var(--ink)}
[data-theme=dark] .msg .bubble{background:var(--card);color:var(--ink)}
[data-theme=dark] .msg.u .bubble{background:#2A2E37;color:#E4E6EB}
[data-theme=dark] .tcard,[data-theme=dark] .td-card,[data-theme=dark] .rv-card{background:linear-gradient(155deg,#241F23,#2B2229)}
[data-theme=dark] .t-impact,[data-theme=dark] .td-impact{color:#D8D3CE}
[data-theme=dark] .shadow-card{background:linear-gradient(135deg,#232028,#2E2430)}

[data-theme=dark] #guideCard .status,[data-theme=dark] .dn-clear{background:var(--chip)}

[data-theme=dark] #chatbox textarea{background:var(--card);color:var(--ink);border-color:var(--line)}

</head>
<body>
<div id="edge"><span class="vtext">VOYAGE · 全托管学习机</span><div class="pill"><i id="edgePill"></i></div><span class="pv" id="edgePct">0%</span></div>
<div id="side">
  <div class="logo"><div class="kicker">OUTPOST 2.0</div><b>全托管学习机</b></div>
  <div class="sidebtns">
    <div class="sbtn on" data-v="learn">◈ <span class="sbtn-t">今天</span></div>
    <div class="sbtn" data-v="progress">◎ <span class="sbtn-t">我的进度</span></div>
    <div class="sbtn lab-extra" data-v="dir">◈ <span class="sbtn-t">方向</span></div>
    <div class="sbtn lab-extra" data-v="dungeon">⚔ <span class="sbtn-t">实战副本</span></div>
    <div class="sbtn lab-extra" data-v="sediment">✓ <span class="sbtn-t">学会的</span></div>
    <div class="sbtn lab-extra" data-v="graph">🕸 <span class="sbtn-t">知识地图</span></div>
    <div class="sbtn lab-extra" data-v="set">⚙ <span class="sbtn-t">设置</span></div>
    <div class="sbtn" id="labToggle" onclick="toggleLab()" title="实验室：展开全部功能">⚗ <span class="sbtn-t">实验室</span></div>
  </div>
  <div id="subjectBox"><input id="subjectInput" placeholder="想学什么？一句话开课" onkeydown="if(event.key==='Enter')addSubject()"><button onclick="addSubject()">开课</button><button class="sb-plus" onclick="switchTab('dir')" title="去方向页开新课">＋</button></div>
  <div id="lessonList"><div class="empty" style="margin-top:24px;padding:0 10px">加载中…</div></div>
  <div id="subjFoot"></div>
</div>

<div id="main">
  <div id="topbar"><div><div class="kicker" id="kicker">LEARNING · 对话式教学</div><h1 id="lessonTitle">今天丢来的</h1></div><div style="display:flex;gap:8px;flex-shrink:0"><button id="todayClass" class="backbtn hidden" style="border-color:var(--line);color:var(--mut)" onclick="openTodayClass()">今天的课</button><button id="backToday" class="backbtn hidden" onclick="backToday()">← 跳回今日知识点</button></div></div>
  <div id="view">
    <div id="chatOuter"><div id="guideCard"></div><div id="planCard"></div><div id="chat"></div></div>
    <div id="dirView" class="hidden"></div>
    <div id="progressView" class="hidden">
    <div id="progressTabs">
      <button class="ptab on" data-pt="dungeon" onclick="switchProgTab('dungeon')">⚔ 实战副本</button>
      <button class="ptab" data-pt="sediment" onclick="switchProgTab('sediment')">✓ 学会的</button>
      <button class="ptab" data-pt="graph" onclick="switchProgTab('graph')">🕸 知识地图</button>
      <button class="ptab" data-pt="opp" onclick="switchProgTab('opp')">🚪 去处</button>
    </div>
    <div style="max-width:min(920px,100%);margin:0 auto 6px;padding:0 24px;font-size:11.5px;color:var(--mut)">今天的安排按复习间隔（FSRS 记忆科学）推进——不是随机出题；能力估计与选题实验默认关闭。</div>
    <div id="progStats" style="max-width:min(920px,100%);margin:0 auto 10px;padding:0 24px;font-size:12.5px;font-weight:600"></div>
    <div id="dunHallView" class="hidden"></div>
    <div id="sediment" class="hidden"></div>
    <div id="graphWrap" class="hidden"><div class="gLegend">圆=收尾的知识点 · <span style="color:#0071e3;font-weight:600">━</span> 练习中真实调用的连接（×N=次数） · <span style="color:#b8c0c8">━</span> 课程先后 · 点圆回到对话</div><canvas id="graphCanvas"></canvas></div>
    <div id="oppView" class="hidden" style="max-width:min(920px,100%);margin:0 auto;padding:8px 24px 130px"></div>
    </div>
    <div id="setView" class="hidden"></div>
  </div>
  <div class="inputbar">
    <div id="chatbox">
      <textarea id="input" placeholder="回答检查题，或问点什么…（Enter 发送）"></textarea>
      <button onclick="stuckHint()">我卡住了</button>
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const toast=(m,ms)=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||2400)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let STATE=null, CURRENT=null, LASTVERDICT=false;

async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(r.status>=400)throw new Error(j.error||j.Error||'请求失败');return j}
// 输入乱码防线（编码统一）：剪贴板编码不一致的文本带典型特征——提示但不拦发
function looksGarbled(t){
  if(!t)return false;
  if(t.indexOf('\uFFFD')>=0)return true;
  const dia=(t.match(/[♦◊◆]/g)||[]).length;
  const acc=(t.match(/[æøåÃâÅÞð]/g)||[]).length;
  return dia>=3&&acc>=1;
}
function garbleWarn(t){if(looksGarbled(t))toast('检测到疑似乱码输入（常见于剪贴板编码不一致）——已发送，但建议重新输入',4200)}

function fmtContent(raw){
  raw=raw||'';
  let hints='';
  // [PROPOSE-VOID]：旧提案作废（用户转向新方向）——收起提示
  if(raw.indexOf('[PROPOSE-VOID]')>=0){
    raw=raw.replace(/\[PROPOSE-VOID\]/g,'').trim();
    hints+='<span class="mark propose" style="color:var(--mut)">旧提案已收起——按新方向继续聊</span>';
  }
  // [PROPOSE] JSON 块折叠成一行提示（提案卡由方向视图单独渲染，消息流里不糊原始 JSON）
  let hint='';
  const i=raw.indexOf('[PROPOSE]');
  if(i>=0){
    let depth=0,end=-1,inStr=false;
    for(let j=i+9;j<raw.length;j++){
      const c=raw[j];
      if(inStr){if(c==='\\')j++;else if(c==='"')inStr=false;continue}
      if(c==='"')inStr=true;
      else if(c==='{')depth++;
      else if(c==='}'){depth--;if(depth===0){end=j+1;break}}
    }
    const before=raw.slice(0,i).replace(/\s+$/,'');
    const after=end>=0?raw.slice(end).replace(/^\s+/,''):'';
    raw=(before&&(before+'\n\n'))+after;
    hint='<span class="mark propose">📋 课程提案已生成'+(curView==='dir'?'——见下方卡片':'')+'</span>';
  }
  let html=esc(raw);
  html=html.replace(/\[PASS:partial\]/g,'<span class="mark partial">◐ 本节收尾（半懂也记录在案，继续往下走）</span>');
  html=html.replace(/\[PASS\]/g,'<span class="mark">✓ 本节收尾通过</span>');
  const body=hint+(html?'<br>'+html:'');
  return hints?hints+(body?'<br>'+body:''):body;
}
let curView='learn';
/* 小穗收敛轮②：实验室开关——默认只露主入口；⚗ 本会话展开，设置页「显示全部功能」持久展开 */
let LAB_OPEN=false;
try{LAB_OPEN=localStorage.getItem('voyage.lab')==='1'}catch(e){}
function applyLab(){
  document.querySelectorAll('.lab-extra').forEach(el=>el.classList.toggle('hidden',!LAB_OPEN));
  const t=document.getElementById('labToggle');
  if(t)t.classList.toggle('on',LAB_OPEN);
}
function toggleLab(){LAB_OPEN=!LAB_OPEN;try{localStorage.setItem('voyage.lab',LAB_OPEN?'1':'0')}catch(e){};applyLab()}
/* 版本自检：服务重启（发版）后驻留窗口自动刷新——用户永不需要手动 Ctrl+R */
let VER0=null;
async function checkVersion(){
  try{
    const v=(await api('/api/version')).started;
    if(VER0===null){VER0=v;return}
    if(v!==VER0){location.reload()}
  }catch(e){}
}
window.addEventListener('focus',checkVersion);
setInterval(checkVersion,30000);
checkVersion();
function updateChrome(v){
  // 「跳回今日知识点」只属于沉淀/关联两页；「今天的课」只在练习态（看完课的入口）
  const back=(v==='sediment'||v==='graph')&&STATE&&STATE.today;
  $('backToday').classList.toggle('hidden',!back);
  $('todayClass').classList.toggle('hidden',!(v==='learn'&&EXER&&!HIST));
  const kb=$('kicker');
  if(v==='sediment'){kb.textContent='SEDIMENT · 已经学会的';$('lessonTitle').textContent='沉淀'}
  else if(v==='dir'){kb.textContent='DIRECTION · 学习方向';$('lessonTitle').textContent='方向'}
  else if(v==='progress'){kb.textContent='PROGRESS · 我的进度';$('lessonTitle').textContent=PROG_TAB==='dungeon'?'实战副本':(PROG_TAB==='sediment'?'学会的':'知识地图')}
  else if(v==='graph'){kb.textContent='GRAPH · 知识地图';$('lessonTitle').textContent='关联'}
  else if(v==='set'){kb.textContent='SETTINGS · 模型与约束';$('lessonTitle').textContent='设置'}
  else if(HIST){kb.textContent='HISTORY · 对话历史'}
  else if(EXER){kb.textContent='PRACTICE · 实操练习'}
  else{kb.textContent='LEARNING · 对话式教学'}
  $('chatbox').style.display=(v==='learn'&&!HIST)?'flex':'none';
  const dis=!!HIST;$('input').disabled=dis;
  const b=$('chatbox').querySelector('button');if(b)b.disabled=dis;
  $('input').placeholder=HIST?'历史对话只读':(EXER?'写下解法/算式，或直接贴本地文件路径交作业…':(LASTVERDICT?'本节已收尾——可继续追问，或左侧选下一个':'回答检查题，或问点什么…（Enter 发送）'));
}
function switchTab(v){
  curView=v;
  document.querySelectorAll('.sbtn').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('chatOuter').classList.toggle('hidden',v!=='learn');
  $('dirView').classList.toggle('hidden',v!=='dir');
  $('progressView').classList.toggle('hidden',v!=='progress');
  if(v==='progress')applyProgTab();
  $('setView').classList.toggle('hidden',v!=='set');
  $('sediment').classList.toggle('hidden',v!=='sediment');
  $('graphWrap').classList.toggle('hidden',v!=='graph');
  updateChrome(v);
  if(v==='dir')renderDirection();
  if(v==='progress')renderProgress();
  if(v==='set')renderSettings();
  if(v==='sediment')renderSediment();
  if(v==='graph')renderGraph();
}

async function addSubject(){
  const name=$('subjectInput').value.trim();
  if(!name){toast('先输入科目名');return}
  const btn=$('subjectBox').querySelector('button');btn.disabled=true;btn.textContent='拆课中…';
  toast('AI 正在把「'+name+'」拆成课程…（约 20 秒）');
  try{
    await api('/api/subject',{name});
    $('subjectInput').value='';
    CURRENT=null;HIST=null;EXER=null;
    await loadState();
    toast('「'+name+'」课程就绪——第一个知识点已经丢给你',3600);
    if(STATE.today)openLesson(STATE.today.id); // 显式跳出新课，不等条件分支
  }catch(e){
    toast('开课失败：'+e.message+'（输入保留，可直接重试）',4200);
  }
  btn.disabled=false;btn.textContent='开课';
}

function findLessonMeta(nodeId){
  const ls=(STATE&&STATE.curriculum||{}).lessons||[];
  return ls.find(l=>l.id===nodeId)||null;
}

// 本地缓存直开（≤2ms 级）：已有会话不碰网络
function openCached(nodeId){
  leaveHistory();
  const sess=(STATE&&STATE.sessions||{})[nodeId];
  if(!sess)return false;
  CURRENT=nodeId;LASTVERDICT=false;
  renderSidebar();
  const meta=findLessonMeta(nodeId);
  $('lessonTitle').textContent=meta?meta.title:(sess.title||'');
  renderChat(sess.messages,sess.openingMeta);
  LASTVERDICT=endsClosed(sess);
  switchTab('learn');
  return true;
}

async function openLesson(nodeId){
  leaveHistory();
  if(openCached(nodeId))return;
  CURRENT=nodeId;LASTVERDICT=false;
  renderSidebar();
  $('lessonTitle').textContent='助教备课中…';
  try{
    const r=await api('/api/tutor/open',{nodeId});
    if(!STATE.sessions)STATE.sessions={};
    STATE.sessions[nodeId]=r.session;
    $('lessonTitle').textContent=r.session.title;
    renderChat(r.session.messages,r.session.openingMeta);
    switchTab('learn');
    LASTVERDICT=endsClosed(r.session);
    if(r.isNew)toast('新知识点丢给你了——跟着助教走');
  }catch(e){ $('lessonTitle').textContent='暂时打不开'; toast('失败：'+e.message) }
}
function endsClosed(sess){return (sess.messages||[]).some(m=>m.role==='assistant'&&/\[PASS/.test(m.content))}

// 开场指令特征（旧会话无 OpeningMeta 标记时的降级识别）
function isOpeningInstruction(m){
  return m&&m.role==='user'&&typeof m.content==='string'&&m.content.indexOf('知识点：《')===0&&m.content.indexOf('现在开始教学：')>=0;
}
function renderChat(msgs,meta){
  const c=$('chat');c.innerHTML='';
  // 开场元信息条（v3）：节序号+标题+承接——开场指令本身不渲染为用户气泡
  if(meta){
    c.insertAdjacentHTML('beforeend','<div class="meta-line"><span class="no">'+String(meta.index||1).padStart(2,'0')+'</span><span class="ti">'+esc(meta.title||'')+'<span class="why">'+esc(meta.why||'')+'</span></span><span class="op">开场</span></div>');
  }
  (msgs||[]).forEach(m=>{
    if(m.role==='tool')return;          // 工具结果帧：内部数据，不入聊天气泡
    if(!m.content)return;               // 纯工具调用帧（无文本）
    if(m.role==='user'&&isOpeningInstruction(m))return; // 开场指令（新旧会话一律）：不进气泡
    c.insertAdjacentHTML('beforeend','<div class="msg '+(m.role==='assistant'?'a':'u')+'"><div class="bubble">'+fmtContent(m.content)+'</div></div>');
  });
  $('view').scrollTop=$('view').scrollHeight;
}

/* 小穗四轮 2.2：「我卡住了」——第一次只给最小提示，连续两次才给完整解答；正常发言即重置 */
let STUCK_N=0;
function stuckHint(){
  if(HIST){toast('历史对话只读');return}
  if(!CURRENT){toast('先从《今天做什么》的第一步开始');return}
  STUCK_N++;
  const ta=$('input');
  ta.value=STUCK_N>=2
    ?'(我第 ' + STUCK_N + ' 次卡住了) 还是做不出来——这次请给完整解答，一步一步带我做。'
    :'(我卡住了) 请只给一条最小可行提示：指向下一步的具体动作（哪个文件/哪条命令），不要给完整答案。';
  send();
  if(STUCK_N<2){toast('已请助教给最小提示——再卡一次会要完整解答')}
}
async function send(){
  if(HIST)return;
  if(EXER)return sendExercise($('input').value.trim());
  if(!CURRENT){toast('先回答今天的检查题，或点一道练习');return}
  const text=$('input').value.trim();if(!text)return;
  if(STUCK_N>=1&&!text.startsWith('(我'))STUCK_N=0; // 正常发言=解除卡住计数
  garbleWarn(text);
  $('input').value='';
  const c=$('chat');c.insertAdjacentHTML('beforeend','<div class="msg u"><div class="bubble">'+esc(text)+'</div></div>');
  c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble" id="tmpwait">…</div></div>');
  $('view').scrollTop=$('view').scrollHeight;
  try{
    const r=await api('/api/tutor/send',{nodeId:CURRENT,text});
    const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();
    const sess=STATE.sessions[CURRENT];
    if(sess)sess.messages.push({role:'user',content:text},{role:'assistant',content:r.reply});
    c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble">'+fmtContent(r.reply)+'</div></div>');
    $('view').scrollTop=$('view').scrollHeight;
    if(r.verdict){LASTVERDICT=true;await loadState();renderVerdictActions(r.verdict)}
  }catch(e){const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();toast('失败：'+e.message)}
}

/* ---------- 小穗收敛轮①：今天三步（讲→练→副本），做完打勾，当前步高亮，主色唯一 ---------- */
function todaySteps(){
  const st=STATE||{};
  const today=st.today;
  // 步1 讲：今天的课存在=待讲；无（已收尾推进完）=✓
  const s1={done:!today,title:today?today.title:'今日已讲完',act:today?'继续讲':'明天再来'};
  // 步2 练：今日练习全过=✓；有未过=当前
  const exs=st.exercises||[];
  const doneEx=exs.filter(e=>e.status==='done').length;
  const s2={done:exs.length>0&&doneEx===exs.length,
    title:exs.length?(exs.find(e=>e.status!=='done')?exs.find(e=>e.status!=='done').title:'今日 '+exs.length+' 题已过'):'练习待生成',
    act:exs.find(e=>e.status!=='done')?'去做题':'已全部通过'};
  // 步3 副本：进行中=当前（继续）；无=待开（去进度页开影子）
  const act=(st.dungeons||[]).find(x=>x.status==='active');
  const s3=act
    ?{done:false,title:'影子副本',act:'继续 '+(act.cur||0)+'/'+((act.stages||[]).length)+' 关'}
    :{done:(st.trophies||[]).some(t=>(t.date||'').slice(0,10)===new Date().toISOString().slice(0,10)),
      title:'影子副本',act:'去开一个影子'};
  // 当前步：第一个未完成
  const steps=[{k:'讲',fn:'todayGoLearn()',...s1},{k:'练',fn:'todayGoPractice()',...s2},{k:'副本',fn:'todayGoDungeon()',...s3}];
  const cur=steps.findIndex(s=>!s.done);
  steps.forEach((s,i)=>{s.cur=(i===cur)});
  if((mood==='10'||mood==='30')&&steps[2]&&!steps[2].done){steps[2].light=true}
  return steps;
}
function isPaused(){
  const pu=STATE.pausedUntil;
  return pu&&new Date(pu)>new Date();
}
/* P0-3 体面暂停：我先停两周——不算断签、不推提醒、不显示落后；回来时一句欢迎 */
function setPaused(days){
  api('/api/pause',{days:days}).then(async r=>{
    await loadState();
    toast('已经为你按下暂停——到 '+r.pausedUntil+' 之前不推送、不断签。回来时一切都在。',4200);
    renderTodaySteps();
  }).catch(e=>toast('失败：'+e.message));
}
async function resumeNow(){
  await api('/api/pause/end',{});
  await loadState();
  toast('欢迎回来——我们从断点继续。');
  renderTodaySteps();
}
function renderTodaySteps(){
  const el=document.getElementById('planCard');if(!el)return;
  if(isPaused()){
    const until=new Date(STATE.pausedUntil).toLocaleDateString();
    el.innerHTML='<div class="pc" style="padding:16px 20px;text-align:center">'
      +'<div style="font-size:15px;font-weight:700;margin-bottom:4px">⏸ 暂停中（到 '+until+'）</div>'

function nextLessonId(){
  const ls=(STATE.curriculum||{}).lessons||[];

  for(let i=idx+1;i<ls.length;i++){if(ls[i].status!=='done')return ls[i].id}
  for(let i=0;i<idx;i++){if(ls[i].status!=='done')return ls[i].id}

}

async function sendExercise(text){
  if(!text)return;
  garbleWarn(text);
  $('input').value='';
  const c=$('chat');c.insertAdjacentHTML('beforeend','<div class="msg u"><div class="bubble">'+esc(text)+'</div></div>');
  c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble" id="tmpwait">批改中…</div></div>');
  $('view').scrollTop=$('view').scrollHeight;
  try{
    const r=await api('/api/exercise/answer',{id:EXER,text});
    const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();
    const ex=(STATE.exercises||[]).find(x=>x.id===EXER);
    if(ex)ex.messages.push({role:'user',content:text},{role:'assistant',content:r.reply});
    c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble">'+fmtContent(r.reply)+'</div></div>');
    $('view').scrollTop=$('view').scrollHeight;
    if(r.verdict){await loadState();toast('这道练习过了——履历记「用过」')}
  }catch(e){const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();toast('失败：'+e.message)}
}

  }
  ex.forEach(e=>{

    list.appendChild(el);
  });

let GRAPH_MOUSE=null; // hover 状态（mousemove 触发重绘）
async function renderGraph(){
  GNODES=[];
  GRAPH_MOUSE=null;
  const g=await api('/api/graph');
  // 入图资格=教学收尾（status done）
  const learned={};
  ((STATE.curriculum||{}).lessons||[]).forEach(l=>{if(l.status==='done')learned[l.id]=true});
  const nodes=(g.nodes||[]).filter(n=>learned[n.id]).filter((n,i,arr)=>arr.findIndex(m=>m.id===n.id)===i);
  const ctxEdges=(g.edges||[]).filter(e=>e.type==='context'&&learned[e.from]&&learned[e.to]);
  const seqEdges=(g.edges||[]).filter(e=>e.type==='sequence'&&learned[e.from]&&learned[e.to]);
  try{
    window.__graphErr='drawing';
    await new Promise(r=>setTimeout(r,60)); // 布局兜底。不用 rAF：后台页 rAF 会被节流
    const cv=$('graphCanvas');
    if(!cv||!cv.clientWidth){await new Promise(r=>setTimeout(r,60));}
    if(!cv||!cv.clientWidth)throw new Error('画布无尺寸');
    const dpr=window.devicePixelRatio||1;
    cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
    cv.style.width=cv.clientWidth+'px';cv.style.height=cv.clientHeight+'px';
    const ctx=cv.getContext('2d');
    // ---- 布局：FR 力导向（合力+退火位移，数学有界）----
    const W=cv.clientWidth,H=cv.clientHeight;
    nodes.forEach((n,i)=>{const ang=i/nodes.length*Math.PI*2;n.x=W/2+Math.cos(ang)*W*0.26;n.y=H/2+Math.sin(ang)*H*0.26;});
    const byId={};nodes.forEach(n=>byId[n.id]=n);
    nodes.forEach((n,i)=>{n.idx=i;}); // 力循环索引（丢失时 fX[undefined] 会把全场坐标污染成 NaN）
    // 度=真实调用热度（强边权重和）——节点大小与标签亮度都编码它
    const heat={};nodes.forEach(n=>heat[n.id]=0);
    ctxEdges.forEach(e=>{if(heat[e.from]!==undefined)heat[e.from]+= (e.weight||1);if(heat[e.to]!==undefined)heat[e.to]+=(e.weight||1);});
    const rad=id=>{const h=heat[id]||0;return 4.5+Math.min(h,8)*0.35;};
    const fX=nodes.map(()=>0),fY=nodes.map(()=>0);
    for(let it=0;it<380;it++){
      const temp=90*(1-it/380)+5;
      fX.fill(0);fY.fill(0);
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y;
        let d=Math.hypot(dx,dy);if(d<1)d=1;
        const f=(9000+(rad(nodes[i].id)+rad(nodes[j].id))*90)/(d*d),ux=dx/d,uy=dy/d;
        fX[i]-=ux*f;fY[i]-=uy*f;fX[j]+=ux*f;fY[j]+=uy*f;
      }
      ctxEdges.forEach(e=>{
        const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
        const dx=b.x-a.x,dy=b.y-a.y;
        let d=Math.hypot(dx,dy);if(d<1)d=1;
        const f=(d-170)*0.016;
        fX[a.idx]+=dx/d*f;fY[a.idx]+=dy/d*f;
        fX[b.idx]-=dx/d*f;fY[b.idx]-=dy/d*f;
      });
      seqEdges.forEach(e=>{
        const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
        const dx=b.x-a.x,dy=b.y-a.y;
        let d=Math.hypot(dx,dy);if(d<1)d=1;
        const f=(d-160)*0.010;
        fX[a.idx]+=dx/d*f;fY[a.idx]+=dy/d*f;
        fX[b.idx]-=dx/d*f;fY[b.idx]-=dy/d*f;
      });
      nodes.forEach(n=>{
        const df=Math.hypot(fX[n.idx],fY[n.idx]);
        const cl=df>temp?temp/df:1;
        n.x+=fX[n.idx]*cl;n.y+=fY[n.idx]*cl;
        n.x+=(W/2-n.x)*0.004;n.y+=(H/2-n.y)*0.004;
        n.x=Math.max(rad(n.id)+16,Math.min(W-rad(n.id)-16,n.x));
        n.y=Math.max(rad(n.id)+58,Math.min(H-rad(n.id)-70,n.y));
      });
    }
    // ---- 绘制（可被 hover 状态重复调用）----
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      const focus=GRAPH_MOUSE;
      const adj=id=>focus&&(id===focus||ctxEdges.some(e=>(e.from===focus&&e.to===id)||(e.to===focus&&e.from===id))||seqEdges.some(e=>(e.from===focus&&e.to===id)||(e.to===focus&&e.from===id)));
      // 边：默认若有若无；hover 时焦点连线变蓝
      const edge=(e,color,width)=>{
        const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
        const on=focus&&(e.from===focus||e.to===focus);
        ctx.globalAlpha=focus?(on?1:0.06):1;
        ctx.strokeStyle=on?'#0071e3':color;
        ctx.lineWidth=on?1.6:width;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        ctx.globalAlpha=1;
      };
      seqEdges.forEach(e=>edge(e,'rgba(0,0,0,.07)',1));
      ctxEdges.forEach(e=>edge(e,'rgba(0,0,0,.16)',1));
      // 节点：小圆点 + 下方细字标签（未 hover 时安静灰）
      GNODES=[];
      nodes.forEach(n=>{
        const r=rad(n.id);
        const on=focus&&(n.id===focus||adj(n.id));
        const dim=focus&&!on;
        ctx.globalAlpha=focus?(on?1:0.1):0.85;
        ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);
        ctx.fillStyle=focus&&n.id===focus?'#0071e3':(on?'#3b82c4':'#98a1ab');
        ctx.fill();
        const t=String(n.title||'');
        const label=t.length>16?t.slice(0,16)+'…':t;
        ctx.font=(focus&&n.id===focus)?'600 12.5px system-ui':'12px system-ui';
        ctx.fillStyle=focus?(n.id===focus?'#1d1d1f':(adj(n.id)?'#0071e3':'rgba(0,0,0,.3)')):'#6f7883';
        ctx.textAlign='center';
        ctx.fillText(label,n.x,n.y+r+14);
        ctx.globalAlpha=1;
        GNODES.push({id:n.id,x:n.x,y:n.y,r:r});
      });
    };
    draw();
    // ---- hover 交互：聚焦邻域 + DOM tooltip ----
    let tip=document.getElementById('graphTip');
    if(!tip){
      tip=document.createElement('div');tip.id='graphTip';
      tip.style.cssText='position:absolute;pointer-events:none;display:none;background:rgba(28,28,30,.88);backdrop-filter:blur(10px);color:#fff;font:12.5px system-ui;padding:7px 11px;border-radius:9px;z-index:5;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2)';
      cv.parentElement.appendChild(tip);
    }
    cv.onmousemove=ev=>{
      const rect=cv.getBoundingClientRect();
      const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
      const hit=GNODES.find(n=>Math.hypot(n.x-mx,n.y-my)<=Math.max(n.r+8,12));
      const changed=(hit?hit.id:null)!==GRAPH_MOUSE;
      GRAPH_MOUSE=hit?hit.id:null;
      if(changed)draw();
      if(hit){
        const t=byId[hit.id]||{};
        tip.innerHTML='<b>'+t.title.replace(/</g,'&lt;')+'</b><br>已收尾 · 被练习调用 '+ (heat[hit.id]||0) +' 次';
        tip.style.display='block';
        tip.style.left=(ev.clientX-rect.left+16)+'px';
        tip.style.top=(ev.clientY-rect.top+10)+'px';
        cv.style.cursor='pointer';
      }else{
        tip.style.display='none';
        cv.style.cursor='default';
      }
    };
    cv.onmouseleave=()=>{GRAPH_MOUSE=null;draw();tip.style.display='none';};
    window.__graphErr='';
  }catch(err){const m=String(err&&err.message||err);window.__graphErr=m;toast('关联图渲染失败：'+m)}
  // 点击命中 → 回到对应对话
  const cv2=$('graphCanvas');
  cv2.onclick=ev=>{
    const rect=cv2.getBoundingClientRect();
    const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
    const hit=GNODES.find(n=>Math.hypot(n.x-mx,n.y-my)<=Math.max(n.r+8,12));
    if(hit)jumpLesson(hit.id);else toast('这个知识点还没开课——完成前序知识它就来了');
  };
}

/* 沉淀连锚图（显式布局表——小规模离散布局直接查表，防节点重叠） */
function anchorSVG(tr){
  const nodes=tr.nodes||[];
  const W=660,H=210,midY=105,cx=500,cy=midY;
  const LAYOUTS={1:[[110,100]],2:[[110,62],[150,140]],3:[[110,44],[160,105],[110,166]],4:[[95,44],[210,74],[95,150],[210,166]]};
  const layout=LAYOUTS[nodes.length]||LAYOUTS[3];
  const pos=nodes.map((n,i)=>({n,x:layout[i]?layout[i][0]:110,y:layout[i]?layout[i][1]:100}));
  let s='<svg class="anchor-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(nodes.join('、'))+'连向'+esc(tr.name)+'">';
  pos.forEach((p,i)=>{
    const y2=cy+(i-(pos.length-1)/2)*16;
    s+='<line class="an-earned" x1="'+(p.x+80)+'" y1="'+p.y+'" x2="'+(cx-92)+'" y2="'+y2+'"/>';
  });
  if(pos.length>1)s+='<path class="an-ctx" d="M '+(pos[0].x+62)+' '+(pos[0].y+14)+' C '+(pos[0].x+120)+' '+(pos[0].y+26)+', '+(pos[1].x-60)+' '+(pos[1].y-26)+', '+(pos[1].x+18)+' '+(pos[1].y-20)+'"/>';
  pos.forEach(p=>{
    s+='<g><rect class="an-node" x="'+(p.x-8)+'" y="'+(p.y-17)+'" width="78" height="32" rx="9"/><text class="an-label" x="'+(p.x+31)+'" y="'+(p.y+4)+'" text-anchor="middle">'+esc(p.n)+'</text></g>';
  });
  s+='<g><rect class="an-tro" x="'+(cx-84)+'" y="'+(cy-46)+'" width="168" height="92" rx="14" transform="rotate(45 '+cx+' '+cy+')"/>'
    +'<text class="an-label" x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-weight="700">'+esc(tr.name)+'</text>'
    +'<text class="an-sub" x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle">🏆 '+esc(tr.short)+'</text></g>';
  s+='<text class="an-note" x="'+((cx+60)/2)+'" y="'+(cy-58)+'" text-anchor="middle">共同铸成 →</text></svg>';
  return s;
}

/* 大厅：进行中 / 影子候选 / 收藏墙（数据源全部影子化，无项目名——ADR 0001） */
function renderDunHall(){
  const v=$('dunHallView');
  const duns=STATE.dungeons||[];
  const act=duns.find(x=>x.status==='active');
  const abandoned=duns.filter(x=>x.status==='abandoned');
  const pool=(STATE.readings||[]).filter(r=>r.project);
  const ready=pool.filter(r=>r.brief&&r.req);
  const unhatched=pool.filter(r=>!r.brief);
  const used=new Set(duns.map(x=>x.readingId));
  const trophies=STATE.trophies||[];

  let h='<div style="max-width:880px;margin:0 auto;padding:8px 28px 130px">';
  if(act){
    const tot=(act.stages||[]).length;
    h+='<div class="grouplabel">进行中</div><div class="active-card">'
      +'<div class="ac-top"><span class="ac-tag">⚔ 进行中</span><span class="ac-title">？？？？？</span><span style="margin-left:auto" class="chip pink">'+act.cur+'/'+tot+' 关</span></div>'
      +'<div class="pip-track">'+(act.stages||[]).map((sg,i)=>'<div class="pip '+(i<act.cur?'done':(i===act.cur?'cur':''))+'"></div>').join('')+'</div>'
      +'<div class="ac-actions"><button class="btn primary" onclick="openDungeon(\''+act.id+'\')">继续打副本</button><button class="btn ghost" onclick="abandonDungeon(\''+act.id+'\')">收起</button></div></div>';
  }
  h+='<div class="grouplabel">'+(act?'更多影子（打完当前的再开）':'可开启的影子副本 —— 只告诉你需要什么，不告诉你是什么')+'</div>';
  const free=ready.filter(r=>!used.has(r.id)&&!r.done);
  if(free.length){
    free.forEach(r=>{
      h+='<div class="shadow-card"><div class="sh-body">'
        +'<div class="sh-title"><span>⚔ 影子副本 · ？？？？？</span>'+tierHTML(r.tier||0)+starsHTML(r.stars||2)+'</div>'
        +reqHTML(r.req)
        +'<div class="sh-sub">'+((r.req||[]).some(x=>x.miss)?'开门后先由助教补上缺的点，再进关':'所需知识点你全部已收尾 · 通关揭晓它是什么')+'</div></div>'
        +'<div class="sh-actions"><button class="sh-go" onclick="startDungeon(\''+r.id+'\',this)" '+(act?'disabled':'')+'>开门</button>'
        +'<span class="sh-hint">'+(act?'先打完当前的影子':'通关揭晓它是什么')+'</span></div></div>';
    });
  } else if(!unhatched.length&&!act){
    h+='<div class="silo-slot" style="min-height:76px"><small>没有待开的影子——去收尾几个新知识点，孵化器会带来新的</small></div>';
  }
  if(unhatched.length){
    unhatched.forEach(r=>{
      h+='<div class="dh-item dim" style="list-style:none"><div><div class="dh-t" style="filter:blur(.4px)">⚔ ？？？（未孵化）</div><div class="dh-sub">助教先深入项目导读+定档，你确认感兴趣再开门</div></div><button class="btn ghost" onclick="hatchShadow(\''+r.id+'\',this)">孵化影子</button></div>';
    });
  }
  /* 收藏墙 */
  h+='<div class="grouplabel">收藏墙 —— 你亲手做出的东西</div><div class="wall-grid">';
  (trophies||[]).forEach(tr=>{
    h+='<div class="tcard" onclick="trophyDetail(\''+esc(tr.name)+'\')">'
      +'<div class="t-date">复现<br>'+esc(tr.short)+'<br>2026</div>'
      +'<div class="t-badge">🏆 已复现</div><div class="t-name">'+esc(tr.name)+'</div>'
      +'<div class="t-impact">'+esc(tr.repo)+'</div>'
      +'<div class="t-meta"><span>'+tr.stages+' 关</span><span>'+((tr.nodes||[]).length)+' 知识点</span></div></div>';
  });
  const siloN=Math.max(0,2-trophies.length);
  for(let i=0;i<siloN;i++)h+='<div class="silo-slot"><div class="silo"></div><span class="q">？</span><small>？？？（未遇见）</small></div>';
  h+='</div>';
  if(trophies.length){
    h+='<div style="margin-top:12px"><button class="btn ghost" onclick="exportResume(this)">📜 生成实践简历（Markdown，每条挂可点开的证据）</button></div>';
  }
  /* 已收起 */
  if(abandoned.length){
    h+='<div class="grouplabel">已收起</div>';
    abandoned.forEach(d=>{
      h+='<div class="dh-item dim"><div><div class="dh-t">⚔ ？？？？？</div><div class="dh-sub">已收起——影子与关卡都还在</div></div><button class="btn ghost" onclick="reopenDungeon(\''+d.id+'\')">重新开门</button></div>';
    });
  }
  h+='</div>';
  v.innerHTML=h;
}

/* 命令面板 */
let PAL_ITEMS=[],PAL_HOT=0;
function palSource(){
  const items=[
    {ico:'◈',t:'今天 · 继续学习',sub:'视图',run:()=>switchTab('learn')},
    {ico:'◎',t:'我的进度',sub:'视图',run:()=>switchTab('progress')},
    {ico:'⚔',t:'实战副本',sub:'进度',run:()=>{PROG_TAB='dungeon';switchTab('progress')}},
    {ico:'✓',t:'学会的',sub:'进度',run:()=>{PROG_TAB='sediment';switchTab('progress')}},
    {ico:'🕸',t:'知识地图',sub:'进度',run:()=>{PROG_TAB='graph';switchTab('progress')}},
    {ico:'⚙',t:'设置',sub:'视图',run:()=>switchTab('set')},
  ];
  (STATE.curriculum||{}).lessons?.forEach(l=>{
    items.push({ico:'▸',t:l.title,sub:l.status==='done'?'已收尾':'课程',run:()=>openLesson(l.id)});
  });
  return items;
}
function openPalette(){
  let ov=document.getElementById('palette');
  if(ov){closePalette();return}
  ov=document.createElement('div');ov.className='palette';ov.id='palette';
  ov.innerHTML='<div class="pal-box"><input id="palInput" placeholder="跳到课程、视图或动作…">'
    +'<div class="pal-list" id="palList"></div>'
    +'<div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 执行</span><span><kbd>Esc</kbd> 关闭</span></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closePalette()});
  const inp=ov.querySelector('#palInput');
  PAL_ITEMS=palSource();PAL_HOT=0;
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();
    const list=PAL_ITEMS.filter(x=>!q||x.t.toLowerCase().includes(q));
    ov.querySelector('#palList').innerHTML=list.length?list.map((x,i)=>
      '<div class="pal-item'+(i===PAL_HOT?' hot':'')+'" data-i="'+PAL_ITEMS.indexOf(x)+'"><span class="pi-ico">'+x.ico+'</span>'+esc(x.t)+'<span class="pi-sub">'+x.sub+'</span></div>').join('')
      :'<div class="pal-empty">没有匹配项</div>';
    ov.querySelectorAll('.pal-item').forEach(el=>el.onclick=()=>{const it=PAL_ITEMS[+el.dataset.i];closePalette();it.run()});
  };
  inp.oninput=()=>{PAL_HOT=0;draw()};
  inp.onkeydown=e=>{
    const q=inp.value.trim().toLowerCase();
    const list=PAL_ITEMS.filter(x=>!q||x.t.toLowerCase().includes(q));
    if(e.key==='ArrowDown'){e.preventDefault();PAL_HOT=Math.min(PAL_HOT+1,list.length-1);draw()}
    else if(e.key==='ArrowUp'){e.preventDefault();PAL_HOT=Math.max(PAL_HOT-1,0);draw()}
    else if(e.key==='Enter'){e.preventDefault();if(list[PAL_HOT]){closePalette();list[PAL_HOT].run()}}
  };
  draw();
  setTimeout(()=>inp.focus(),30);
}
function closePalette(){const ov=document.getElementById('palette');if(ov)ov.remove()}
/* Esc 关弹层（面板/纪念卡详情/揭晓——揭晓不关，是仪式） */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closePalette();
    const td=document.querySelector('.tdetail');if(td)td.remove();
  }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();openPalette();
  }
});

/* 今日提醒（可关闭）：服务端今日计划未完成时，每 30 分钟最多提醒一次 */
(function(){
  let timer=null;
  window.setDailyRemind=function(on){
    localStorage.setItem('voyage.remind',on?'1':'0');
    if(timer){clearInterval(timer);timer=null}
    if(on){
      checkRemind();
      timer=setInterval(checkRemind,30*60*1000);
      toast('今日提醒已开启——还差步骤时会通知你');
    }else toast('今日提醒已关闭');
  };
  async function checkRemind(){
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    try{const s0=STATE||{};if(s0.pausedUntil&&new Date(s0.pausedUntil)>new Date())return}catch(e){} // 暂停期不推
    if(document.visibilityState==='visible')return; /* 窗口在前台就不用打扰 */
    const last=localStorage.getItem('voyage.remindAt');
    const today=new Date().toDateString();
    if(last===today+':sent')return;
    try{
      const st=await api('/api/state');
      const plan=st.plan||{};
      const total=(plan.main||[]).length;
      const doneN=(st.done&&st.done.main?st.done.main:[]).length;
      const left=total-doneN;
      if(left>0){
        new Notification('前哨 · 今天还差 '+left+' 步', {body:'上次你停在「'+((st.today||{}).title||'今天的课')+'」——点开继续。'});
        localStorage.setItem('voyage.remindAt',today+':sent');
      }
    }catch(e){}
  }
})();
