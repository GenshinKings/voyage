<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前哨 2.0 · 全托管学习机</title>
<style>
:root{--ink:#101B29;--paper:#FAFAF7;--side:#FFFFFF;--line:#D8DDE3;--mut:#6B7684;--pink:#FB7299;--usr:#EEF2F7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);display:flex;height:100vh;overflow:hidden}
#side{width:250px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
#side .logo{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
#side .logo .kicker{font-size:11px;letter-spacing:.2em;color:var(--mut)}
#side .logo b{font-size:16px}
.sidebtns{padding:8px;border-bottom:1px solid var(--line)}
.sbtn{padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--mut);font-size:13.5px;margin-bottom:2px}
.sbtn:hover{background:#F1F2EE}
.sbtn.on{color:var(--ink);background:#EAEDEF;font-weight:600}
#subjectBox{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}
#subjectBox input{flex:1;min-width:0;border:1px solid var(--line);padding:6px 10px;font:inherit;border-radius:4px;outline:none}
#subjectBox input:focus{border-color:var(--ink)}
#subjectBox button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit}
#lessonList{flex:1;overflow-y:auto;padding:8px 6px}
.grouplabel{font-size:11px;letter-spacing:.15em;color:var(--mut);margin:10px 10px 4px}
.lp{padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13.5px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.lp:hover{background:#F1F2EE}
.lp.on{background:#EAEDEF;font-weight:600}
.lp .st{font-size:11px;flex-shrink:0;width:14px}
.lp.done{color:var(--mut)}
.lp.done .st{color:#3FBF7F}
.lp.today .st{color:var(--pink);font-weight:700}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{padding:10px 24px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px}
.backbtn{border:1px solid var(--pink);background:transparent;color:var(--pink);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap;flex-shrink:0}
.backbtn:hover{background:rgba(251,114,153,.08)}
#topbar .kicker{font-size:11px;letter-spacing:.2em;color:var(--mut)}
#topbar h1{font-size:20px}
#view{flex:1;overflow-y:auto;padding:24px 0}
#chat{max-width:760px;margin:0 auto;padding:0 28px}
.msg{margin:14px 0;display:flex}
.msg .bubble{max-width:82%;padding:12px 16px;border-radius:10px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.a .bubble{background:#F1F2EE;border:1px solid #E3E7EA}
.msg.u{justify-content:flex-end}
.msg.u .bubble{background:var(--usr);border:1px solid #DCE4EE}
.bubble .mark{display:block;margin-top:10px;font-weight:700;color:#3FBF7F}
.bubble .mark.partial{color:#8a7a3a}
.inputbar{border-top:1px solid var(--line);background:var(--paper);padding:16px 28px 20px}
#chatbox{max-width:760px;margin:0 auto;display:flex;gap:10px}
#chatbox textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:inherit;resize:none;height:52px;outline:none;background:#fff}
#chatbox textarea:focus{border-color:var(--ink)}
#chatbox button{align-self:flex-end;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 22px;border-radius:8px;cursor:pointer;font:inherit}
.empty{color:var(--mut);text-align:center;margin-top:80px;font-size:14px}
#sediment{max-width:760px;margin:0 auto;padding:0 28px}
.counts{display:flex;gap:28px;margin:18px 0}
.counts .c .n{font-size:30px;font-weight:700}
.counts .c .l{color:var(--mut);font-size:13px}
.item{padding:10px 0 10px 14px;border-left:3px solid var(--line);margin:8px 0}
.item.d3{border-color:var(--ink)}.item.d2{border-color:#5a7a99}.item.d1{border-color:#b8c4d0}
.item.clickable{cursor:pointer}
.item.clickable:hover{background:#F1F2EE}
.item .t{font-weight:600}.item .m{color:var(--mut);font-size:12.5px}
#graphWrap{height:calc(100vh - 130px);position:relative}
canvas{width:100%;height:100%;display:block}
.gLegend{position:absolute;top:12px;left:16px;font-size:12.5px;color:var(--mut);background:rgba(255,255,255,.85);padding:6px 12px;border:1px solid var(--line);border-radius:6px}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 22px;font-size:14px;display:none;border-radius:6px;z-index:9}
a{color:var(--ink)}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="side">
  <div class="logo"><div class="kicker">OUTPOST 2.0</div><b>全托管学习机</b></div>
  <div class="sidebtns">
    <div class="sbtn on" data-v="learn">◈ 学习</div>
    <div class="sbtn" data-v="sediment">◈ 沉淀</div>
    <div class="sbtn" data-v="graph">◈ 关联</div>
  </div>
  <div id="subjectBox">
    <input id="subjectInput" placeholder="想学的科目…">
    <button onclick="addSubject()">开课</button>
  </div>
  <div class="grouplabel" style="padding:8px 12px 0">今天</div>
  <div id="lessonList"><div class="empty" style="margin-top:24px;padding:0 10px">加载中…</div></div>
</div>

<div id="main">
  <div id="topbar"><div><div class="kicker" id="kicker">LEARNING · 对话式教学</div><h1 id="lessonTitle">今天丢来的</h1></div><button id="backToday" class="backbtn hidden" onclick="backToday()">← 跳回今日知识点</button></div>
  <div id="view">
    <div id="chatOuter"><div id="chat"></div></div>
    <div id="sediment" class="hidden"></div>
    <div id="graphWrap" class="hidden"><div class="gLegend">圆=知识点 · 线=先后关系 · 越深=学得越扎实 · 点圆回到对话</div><canvas id="graphCanvas"></canvas></div>
  </div>
  <div class="inputbar">
    <div id="chatbox">
      <textarea id="input" placeholder="回答检查题，或问点什么…（Enter 发送）"></textarea>
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let STATE=null, CURRENT=null, LASTVERDICT=false;

async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(r.status>=400)throw new Error(j.error||j.Error||'请求失败');return j}

function fmtContent(raw){
  let html=esc(raw);
  html=html.replace(/\[PASS:partial\]/g,'<span class="mark partial">◐ 本节收尾（半懂也记录在案，继续往下走）</span>');
  html=html.replace(/\[PASS\]/g,'<span class="mark">✓ 本节收尾通过</span>');
  return html;
}
function switchTab(v){
  document.querySelectorAll('.sbtn').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('chatOuter').classList.toggle('hidden',v!=='learn');
  $('sediment').classList.toggle('hidden',v!=='sediment');
  $('graphWrap').classList.toggle('hidden',v!=='graph');
  if(v==='sediment')renderSediment();
  if(v==='graph')renderGraph();
}

async function addSubject(){
  const name=$('subjectInput').value.trim();
  if(!name){toast('先输入科目名');return}
  toast('AI 正在把「'+name+'」拆成课程…（约 20 秒）');
  $('subjectInput').value='';
  try{ await api('/api/subject',{name}); CURRENT=null; await loadState(); toast('课程就绪——第一个知识点已丢给你'); }
  catch(e){ toast('失败：'+e.message) }
}

function findLessonMeta(nodeId){
  const ls=(STATE&&STATE.curriculum||{}).lessons||[];
  return ls.find(l=>l.id===nodeId)||null;
}

// 本地缓存直开（≤2ms 级）：已有会话不碰网络
function openCached(nodeId){
  leaveHistory();
  const sess=(STATE&&STATE.sessions||{})[nodeId];
  if(!sess)return false;
  CURRENT=nodeId;LASTVERDICT=false;
  renderSidebar();
  const meta=findLessonMeta(nodeId);
  $('lessonTitle').textContent=meta?meta.title:(sess.title||'');
  renderChat(sess.messages);
  LASTVERDICT=endsClosed(sess);
  switchTab('learn');
  return true;
}

async function openLesson(nodeId){
  leaveHistory();
  if(openCached(nodeId))return;
  CURRENT=nodeId;LASTVERDICT=false;
  renderSidebar();
  $('lessonTitle').textContent='助教备课中…';
  try{
    const r=await api('/api/tutor/open',{nodeId});
    if(!STATE.sessions)STATE.sessions={};
    STATE.sessions[nodeId]=r.session;
    $('lessonTitle').textContent=r.session.title;
    renderChat(r.session.messages);
    switchTab('learn');
    LASTVERDICT=endsClosed(r.session);
    if(r.isNew)toast('新知识点丢给你了——跟着助教走');
  }catch(e){ $('lessonTitle').textContent='暂时打不开'; toast('失败：'+e.message) }
}
function endsClosed(sess){return (sess.messages||[]).some(m=>m.role==='assistant'&&/\[PASS/.test(m.content))}

function renderChat(msgs){
  const c=$('chat');c.innerHTML='';
  (msgs||[]).forEach(m=>{c.insertAdjacentHTML('beforeend','<div class="msg '+(m.role==='assistant'?'a':'u')+'"><div class="bubble">'+fmtContent(m.content)+'</div></div>')});
  $('view').scrollTop=$('view').scrollHeight;
}

async function send(){
  if(HIST){toast('历史对话只读——点右上角回到今天');return}
  if(!CURRENT){toast('先在左侧选一个知识点');return}
  if(LASTVERDICT){toast('这一节已收尾——左侧选下一个知识点');return}
  const text=$('input').value.trim();if(!text)return;
  $('input').value='';
  const c=$('chat');c.insertAdjacentHTML('beforeend','<div class="msg u"><div class="bubble">'+esc(text)+'</div></div>');
  c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble" id="tmpwait">…</div></div>');
  $('view').scrollTop=$('view').scrollHeight;
  try{
    const r=await api('/api/tutor/send',{nodeId:CURRENT,text});
    const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();
    c.insertAdjacentHTML('beforeend','<div class="msg a"><div class="bubble">'+fmtContent(r.reply)+'</div></div>');
    $('view').scrollTop=$('view').scrollHeight;
    if(r.verdict){LASTVERDICT=true;await loadState();toast(r.verdict==='partial'?'本节收尾（半懂记录在案）——下一节来了':'本节收尾——履历已记「知道」，下一节来了')}
  }catch(e){const tmp=$('tmpwait');if(tmp)tmp.closest('.msg').remove();toast('失败：'+e.message)}
}

async function loadState(){
  STATE=await api('/api/state');
  renderSidebar();
  if(!CURRENT&&!HIST&&STATE.today){if(!openCached(STATE.today.id))openLesson(STATE.today.id)}
}
function renderSidebar(){
  const list=$('lessonList');list.innerHTML='';
  if(!STATE.curriculum||!(STATE.curriculum.lessons||[]).length){
    list.innerHTML='<div class="empty" style="margin-top:24px;padding:0 10px">输入想学的科目，<br>AI 会拆成课程，今天开始教</div>';return;
  }
  // 只考虑今天要学什么：侧栏只放今天这一封；
  // 历史对话不属于侧栏——沉淀/关联点进去，占地不大
  if(!STATE.today){
    list.innerHTML='<div class="empty" style="margin-top:24px;padding:0 10px">今天没有排课</div>';return;
  }
  const all=STATE.curriculum.lessons||[];
  const l=all.find(x=>x.id===STATE.today.id);
  const title=l?l.title:(STATE.today.title||'今日知识点');
  const sess=(STATE.sessions||{})[STATE.today.id];
  const fin=!!(sess&&endsClosed(sess));
  const el=document.createElement('div');
  el.className='lp today'+(CURRENT===STATE.today.id&&!HIST?' on':'');
  el.innerHTML='<span class="st">'+(fin?'✓':'今')+'</span><span>'+esc(title)+'</span>';
  el.onclick=()=>fin?showHistory(STATE.today.id):openLesson(STATE.today.id);
  list.appendChild(el);
}
function renderSediment(){
  const s=$('sediment');const st=STATE;if(!st)return;
  let html='<h1 style="font-size:24px;margin:20px 0">已经学会的</h1><div class="counts"><div class="c"><div class="n">'+st.counts.known+'</div><div class="l">知道</div></div><div class="c"><div class="n">'+st.counts.used+'</div><div class="l">用过</div></div><div class="c"><div class="n">'+st.counts.done+'</div><div class="l">做过</div></div></div>';
  (st.ledger||[]).forEach(k=>{
    const clickable=k.id&&(st.sessions||{})[k.id];
    html+='<div class="item d'+k.depth+(clickable?' clickable':'')+'"'+(clickable?' onclick=\'jumpLesson("'+k.id+'")\' title="看这段对话的完整历史"':'')+'><div class="t">'+esc(k.title)+'</div><div class="m">'+(k.depth===3?'做过':k.depth===2?'用过':'知道')+' · 首学 '+esc((k.firstAt||'').slice(0,10))+' · 来源 '+esc(k.source)+(clickable?' · 点击看完整对话':'')+'</div></div>';
  });
  if(!(st.ledger||[]).length)html+='<div class="mut">履历还是空的。完成第一节的检查题，这里就长出第一条。</div>';
  html+='<div style="margin-top:24px"><a href="/evidence.html" target="_blank">对外证据页 →</a></div>';
  s.innerHTML=html;
}
/* 历史对话：从沉淀/关联进场，只读展示 + 跳回今日按钮 */
let HIST=null;
function enterHistory(){
  HIST=true;if(!CURRENT)CURRENT=null;
  $('kicker').textContent='HISTORY · 对话历史';
  $('backToday').classList.remove('hidden');
  $('input').disabled=true;$('input').placeholder='历史对话只读——点右上角回到今天';
  const b=$('chatbox').querySelector('button');if(b)b.disabled=true;
}
function leaveHistory(){
  HIST=null;
  $('kicker').textContent='LEARNING · 对话式教学';
  $('backToday').classList.add('hidden');
  $('input').disabled=false;$('input').placeholder='回答检查题，或问点什么…（Enter 发送）';
  const b=$('chatbox').querySelector('button');if(b)b.disabled=false;
}
function backToday(){leaveHistory();if(STATE.today)openLesson(STATE.today.id)}
function jumpLesson(nodeId){
  const sess=(STATE&&STATE.sessions||{})[nodeId];
  if(!sess){toast('还没轮到它——到日子我自然丢给你');return}
  CURRENT=null;enterHistory();
  const meta=findLessonMeta(nodeId);
  $('lessonTitle').textContent=meta?meta.title:(sess.title||'');
  renderChat(sess.messages);
  switchTab('learn');
}

/* ---------- 关联图：力导向 ---------- */
let GNODES=[];
async function renderGraph(){
  GNODES=[];
  const g=await api('/api/graph');
  const nodes=(g.nodes||[]).map((n,i)=>({...n,x:0,y:0,idx:i}));
  const edges=g.edges||[];
  // 标准 FR 力导向：合力先累加，位移按退火温度 clamp —— 数学上不可能发散（旧版逐对直接位移曾振荡炸成 NaN）
  const cx=640,cy=320;
  nodes.forEach((n,i)=>{const ang=i/nodes.length*Math.PI*2;n.x=cx+Math.cos(ang)*280;n.y=cy+Math.sin(ang)*185});
  const byId={};nodes.forEach(n=>byId[n.id]=n);
  const fX=nodes.map(()=>0),fY=nodes.map(()=>0);
  for(let it=0;it<400;it++){
    const temp=90*(1-it/400)+5;
    fX.fill(0);fY.fill(0);
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y;
      let d=Math.hypot(dx,dy);if(d<1)d=1;
      const f=10000/(d*d),ux=dx/d,uy=dy/d;
      fX[i]-=ux*f;fY[i]-=uy*f;fX[j]+=ux*f;fY[j]+=uy*f;
    }
    edges.forEach(e=>{
      const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
      const dx=b.x-a.x,dy=b.y-a.y;
      let d=Math.hypot(dx,dy);if(d<1)d=1;
      const f=(d-150)*0.014;
      fX[a.idx]+=dx/d*f;fY[a.idx]+=dy/d*f;
      fX[b.idx]-=dx/d*f;fY[b.idx]-=dy/d*f;
    });
    nodes.forEach(n=>{
      const df=Math.hypot(fX[n.idx],fY[n.idx]);
      const cl=df>temp?temp/df:1;
      n.x+=fX[n.idx]*cl;n.y+=fY[n.idx]*cl;
      n.x+=(cx-n.x)*0.004;n.y+=(cy-n.y)*0.004;
    });
  }
  try{
    window.__graphErr='drawing';
    const cv=$('graphCanvas');
    if(!cv||!cv.clientWidth){await new Promise(r=>setTimeout(r,60));} // 布局兜底。不用 rAF：后台页面 rAF 会被浏览器节流暂停
    if(!cv||!cv.clientWidth)throw new Error('画布无尺寸');
    const dpr=window.devicePixelRatio||1;
    cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    const px=x=>Math.max(36,Math.min(cv.clientWidth-36,x));
    const py=y=>Math.max(36,Math.min(cv.clientHeight-56,y));
    edges.forEach(e=>{
      const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);if(!a||!b)return;
      ctx.strokeStyle='#C9D1D9';ctx.lineWidth=1.2;ctx.beginPath();
      ctx.moveTo(px(a.x),py(a.y));ctx.lineTo(px(b.x),py(b.y));ctx.stroke();
    });
    GNODES=[];
    nodes.forEach(n=>{
      const x=px(n.x),y=py(n.y);
      ctx.beginPath();ctx.arc(x,y,16,0,7);
      ctx.fillStyle=(n.status==='done')?'#101B29':'#B7C4D2';
      ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#101B29';ctx.font='12px system-ui';ctx.textAlign='center';
      const t=String(n.title||'');ctx.fillText(t.length>9?t.slice(0,9)+'…':t,x,y+32);
      GNODES.push({id:n.id,x:x,y:y});
    });
    window.__graphErr='';
  }catch(err){const m=String(err&&err.message||err);window.__graphErr=m;toast('关联图渲染失败：'+m)}
  // canvas 点击命中 → 回到对应对话
  const cv=$('graphCanvas');
  cv.onclick=ev=>{
    const rect=cv.getBoundingClientRect();
    const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
    const hit=GNODES.find(n=>Math.hypot(n.x-mx,n.y-my)<=18);
    if(hit)jumpLesson(hit.id);else toast('这个知识点还没开课——完成前序知识它就来了');
  };
}

/* 启动 */
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.querySelectorAll('.sbtn').forEach(t=>t.onclick=()=>switchTab(t.dataset.v));
loadState();
</script>
</body>
</html>
