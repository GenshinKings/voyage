<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前哨 2.0</title>
<style>
:root{--ink:#101B29;--paper:#FAFAF7;--line:#D8DDE3;--mut:#6B7684;--pink:#FB7299}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;max-width:860px;margin:0 auto;padding:44px 28px 80px}
.kicker{font-size:12px;letter-spacing:.22em;color:var(--mut)}
h1{font-size:34px;font-weight:700;margin:6px 0 2px}
.date{color:var(--mut);font-size:14px;margin-bottom:28px}
.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.num{font-size:20px;font-weight:700;color:var(--pink)}
.sec-head h2{font-size:17px}
.sec-head .sub{color:var(--mut);font-size:13px;margin-left:auto}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px dashed var(--line)}
.task .no{font-weight:700;font-size:15px;min-width:26px;color:#8fa0b3}
.task .body{flex:1}
.task .t{font-weight:600}
.task .m{color:var(--mut);font-size:13px}
.task.done .t{text-decoration:line-through;color:var(--mut)}
button{font:inherit;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 14px;cursor:pointer}
button:hover{border-color:var(--pink);color:var(--pink)}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:#22314a}
.pill{display:inline-block;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:1px 8px;margin-left:8px}
.note{background:#F1F2EE;border-left:3px solid var(--ink);padding:10px 14px;font-size:14px;color:#414b58;margin-top:14px}
.mood{display:flex;gap:10px;margin-top:16px}
.mood button{flex:1;padding:10px}
.grad{margin-top:8px;font-size:14px;color:var(--mut)}
a{color:var(--ink)}
.mut{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 22px;font-size:14px;display:none}
</style>
</head>
<body>
<div class="kicker">OUTPOST 2.0 · 全托管学习机</div>
<h1 id="greet">今天丢来的</h1>
<div class="date" id="date"></div>

<div class="sec">
  <div class="sec-head"><span class="num">01</span><h2>主推进</h2><span class="sub" id="shape"></span></div>
  <div id="main"></div>
</div>

<div class="sec">
  <div class="sec-head"><span class="num">02</span><h2>侧链复习</h2><span class="sub">≤10 分钟 · 到期即补</span></div>
  <div id="reviews"></div>
</div>

<div class="sec">
  <div class="sec-head"><span class="num">03</span><h2>可选加餐</h2><span class="sub">不做也完全合法</span></div>
  <div id="extras"></div>
</div>

<div class="sec">
  <div class="sec-head"><span class="num">04</span><h2>收工</h2></div>
  <div class="mood">
    <button onclick="mood('还想来',true)">完成 · 还想来</button>
    <button onclick="mood('今天够了',true)">完成 · 今天够了</button>
    <button onclick="mood('',false)">今天没完成</button>
  </div>
  <div class="note" id="note"></div>
  <div class="grad" id="grad"></div>
</div>

<div class="sec">
  <div class="sec-head"><span class="num">05</span><h2>履历</h2><span class="sub" id="counts"></span></div>
  <div id="ledger"></div>
  <p class="mut" style="margin-top:10px"><a href="/evidence.html">对外证据页 →</a>　<span id="sandboxTip"></span></p>
</div>

<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});return r.json()}

async function refresh(){await api('/api/refresh');load()}

async function completeMain(title){
  await api('/api/complete-main',{title});
  document.querySelectorAll('#main .task').forEach(el=>{if(el.dataset.t===title)el.classList.add('done')});
  toast('已消化：'+title);
}
async function mood(mood,completed){
  await api('/api/mood',{mood,completed});
  toast(mood?('已记录：'+mood):'已记录。明天见。');
}

async function load(){
  const st=await api('/api/state');
  $('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const p=st.plan||{};
  $('shape').textContent=(p.Note||'').split('|')[0];
  $('note').textContent=p.Note||'';
  $('greet').textContent='今天丢来的';
  // 主推进
  const main=$('main');main.innerHTML='';
  (p.Main||[]).forEach((m,i)=>{
    const el=document.createElement('div');el.className='task';el.dataset.t=m.Title;
    el.innerHTML=`<span class="no">0${i+1}</span><div class="body"><div class="t">${esc(m.Title)}</div><div class="m">${esc(m.DeliverableID)} · ${m.Minutes} 分钟</div>
    <button style="margin-top:6px" onclick="completeMain('${esc(m.Title)}')">完成</button></div>`;
    if((st.done.main||[]).includes(m.Title))el.classList.add('done');
    main.appendChild(el);
  });
  if(!(p.Main||[]).length)main.innerHTML='<div class="mut">今天不推进——只保养。这是合法答案。</div>';
  // 复习
  const rv=$('reviews');rv.innerHTML='';
  (p.Reviews||[]).forEach(c=>{
    const el=document.createElement('div');el.className='task';
    el.innerHTML=`<span class="no">·</span><div class="body"><div class="t">${esc(c.Title)}</div><div class="m">到期 ${esc((c.Due||'').slice(0,10))}</div>
    <button style="margin-top:6px" onclick="this.closest('.task').classList.add('done');api('/api/complete-review',{id:'${esc(c.ID)}'})">复习完</button></div>`;
    if((st.done.reviews||[]).includes(c.ID))el.classList.add('done');
    rv.appendChild(el);
  });
  if(!(p.Reviews||[]).length)rv.innerHTML='<div class="mut">今日无到期复习</div>';
  // 加餐
  const ex=$('extras');ex.innerHTML='';
  (p.Extras||[]).forEach(e=>{
    ex.innerHTML+=`<div class="task"><span class="no">+</span><div class="body"><div class="t">${esc(e.Title)}</div><div class="m">加餐 · ${esc(e.Domain)}</div></div></div>`;
  });
  if(!(p.Extras||[]).length)ex.innerHTML='<div class="mut">今天没有加餐</div>';
  // 履历
  $('counts').textContent=`做过 ${st.counts.done} · 用过 ${st.counts.used} · 知道 ${st.counts.known}`;
  const lg=$('ledger');lg.innerHTML='';
  (st.ledger||[]).slice(0,8).forEach(k=>{
    lg.innerHTML+=`<div class="task"><div class="body"><div class="t">${esc(k.title)}</div><div class="m">${k.depth===3?'做过':k.depth===2?'用过':'知道'} · 首学 ${esc((k.firstAt||'').slice(0,10))} · 来源 ${esc(k.source)}</div></div></div>`;
  });
  if(!(st.ledger||[]).length)lg.innerHTML='<div class="mut">履历还是空的——修一个沙盒、完成一片主推进，就会长出第一条。</div>';
  $('grad').textContent='毕业状态：'+(st.graduation?st.graduation.state+' — '+st.graduation.reason:'');
  $('sandboxTip').innerHTML='break-fix 沙盒走命令行：<code>outpost2 sandbox -case bc-mcp-typo -dir 工作区</code>';
}
window.completeMain=completeMain;window.mood=mood;window.api=api;
load();
</script>
</body>
</html>
