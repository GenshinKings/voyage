<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>前哨 · 影子副本 demo</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hall.css">
<link rel="stylesheet" href="css/dungeon.css">
<link rel="stylesheet" href="css/wall.css">
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo"><div class="kicker">OUTPOST 2.0</div><b>全托管学习机</b></div>

    <div class="kicker" id="kicker"></div>
    <div class="h1" id="h1"></div>
    <div class="view" id="view-hall"></div>
    <div class="view" id="view-dungeon" hidden></div>
    <div class="view" id="view-wall" hidden></div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
